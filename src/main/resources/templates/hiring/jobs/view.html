<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Detail - Hiring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f4f6fb; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        .info-label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; color: #6c757d; }
        .content-block { white-space: pre-wrap; }
    </style>
</head>
<body>
<div th:class="${#authorization.expression('hasRole(''ADMIN'')') ? '' : 'container-fluid'}">
    <div th:class="${#authorization.expression('hasRole(''ADMIN'')') ? '' : 'row'}">
        <!-- Sidebar -->
        <div sec:authorize="hasRole('ADMIN')" th:replace="fragments/admin-sidebar :: sidebar"></div>
        <div sec:authorize="!hasRole('ADMIN')" th:replace="fragments/hiring-sidebar :: sidebar"></div>

        <!-- Main Content -->
        <main th:class="${#authorization.expression('hasRole(''ADMIN'')') ? 'admin-main' : 'col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4'}">
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="d-flex justify-content-between align-items-start pb-2 mb-4 border-bottom">
                <div>
                    <h1 class="h3 fw-bold mb-1" th:text="${job.title}">Job title</h1>
                    <div class="d-flex gap-2 flex-wrap">
                        <span class="badge"
                              th:classappend="${job.status == 'ACTIVE'} ? 'text-bg-success' : (${job.status == 'DRAFT'} ? 'text-bg-warning' : (${job.status == 'CLOSED'} ? 'text-bg-secondary' : 'text-bg-danger'))"
                              th:text="${job.status ?: 'N/A'}">ACTIVE</span>
                        <span class="badge text-bg-info" th:text="${job.employmentType ?: 'N/A'}">FULL_TIME</span>
                        <span class="badge text-bg-light" th:text="${job.experienceLevel ?: 'N/A'}">MID</span>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/hiring/jobs/{id}/edit(id=${job.id})}" class="btn btn-outline-warning">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </a>
                    <a th:href="@{/hiring/jobs}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Back
                    </a>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card mb-3">
                        <div class="card-header"><h6 class="mb-0"><i class="bi bi-info-circle me-2"></i>Summary</h6></div>
                        <div class="card-body">
                            <p class="info-label">Department</p>
                            <p class="fw-semibold" th:text="${job.department != null ? job.department.departmentName : 'N/A'}">N/A</p>

                            <p class="info-label">Position</p>
                            <p th:text="${job.position != null ? job.position.positionName : 'N/A'}">N/A</p>

                            <p class="info-label">Location</p>
                            <p>
                                <span th:text="${job.location ?: 'N/A'}">N/A</span>
                                <span class="badge text-bg-primary ms-1" th:if="${job.remoteAllowed == true}">Remote</span>
                            </p>

                            <p class="info-label">Salary Range</p>
                            <p>
                                <span th:text="${job.salaryMin != null ? #numbers.formatDecimal(job.salaryMin, 0, 'COMMA', 0, 'POINT') : 'N/A'}">N/A</span>
                                -
                                <span th:text="${job.salaryMax != null ? #numbers.formatDecimal(job.salaryMax, 0, 'COMMA', 0, 'POINT') : 'N/A'}">N/A</span>
                            </p>

                            <p class="info-label">Posting Date</p>
                            <p th:text="${job.postingDate != null ? #temporals.format(job.postingDate, 'dd/MM/yyyy') : 'N/A'}">N/A</p>

                            <p class="info-label">Closing Date</p>
                            <p th:text="${job.closingDate != null ? #temporals.format(job.closingDate, 'dd/MM/yyyy') : 'N/A'}">N/A</p>

                            <p class="info-label">Applications / Views</p>
                            <p>
                                <span th:text="${job.applicationsCount ?: 0}">0</span>
                                /
                                <span th:text="${job.viewsCount ?: 0}">0</span>
                            </p>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header"><h6 class="mb-0"><i class="bi bi-lightning me-2"></i>Actions</h6></div>
                        <div class="card-body d-grid gap-2">
                            <form th:if="${job.status == 'DRAFT'}" th:action="@{/hiring/jobs/{id}/publish(id=${job.id})}" method="post">
                                <button type="submit" class="btn btn-success w-100"><i class="bi bi-upload me-1"></i>Publish</button>
                            </form>
                            <form th:if="${job.status == 'ACTIVE'}" th:action="@{/hiring/jobs/{id}/close(id=${job.id})}" method="post"
                                  onsubmit="return confirm('Close this job posting?')">
                                <button type="submit" class="btn btn-warning w-100"><i class="bi bi-lock me-1"></i>Close</button>
                            </form>
                            <form th:action="@{/hiring/jobs/{id}/delete(id=${job.id})}" method="post"
                                  onsubmit="return confirm('Delete this job posting?')">
                                <button type="submit" class="btn btn-outline-danger w-100"><i class="bi bi-trash me-1"></i>Delete</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card mb-3">
                        <div class="card-header"><h6 class="mb-0"><i class="bi bi-card-text me-2"></i>Description</h6></div>
                        <div class="card-body content-block" th:text="${job.description ?: 'No description'}">Description</div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h6 class="mb-0"><i class="bi bi-list-check me-2"></i>Requirements</h6></div>
                        <div class="card-body content-block" th:text="${job.requirements ?: 'No requirements'}">Requirements</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
