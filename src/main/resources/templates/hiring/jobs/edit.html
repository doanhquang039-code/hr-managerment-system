<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job Posting - Hiring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/hiring-sidebar :: sidebar"></div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center pb-2 mb-4 border-bottom">
                <div>
                    <h1 class="h3 fw-bold mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i>Edit Job Posting</h1>
                    <small class="text-muted" th:text="${job.title ?: 'Job posting'}">Job posting</small>
                </div>
                <a th:href="@{/hiring/jobs/{id}(id=${job.id})}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back
                </a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="card">
                <div class="card-header"><h5 class="mb-0">Job Details</h5></div>
                <div class="card-body">
                    <form th:action="@{/hiring/jobs/{id}/edit(id=${job.id})}" th:object="${job}" method="post">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Job Title *</label>
                                    <input type="text" class="form-control" id="title" th:field="*{title}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="department" class="form-label">Department *</label>
                                    <select class="form-select" id="department" th:field="*{department}" required>
                                        <option value="">Select Department</option>
                                        <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.departmentName}">Department</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="position" class="form-label">Position</label>
                                    <select class="form-select" id="position" th:field="*{position}">
                                        <option value="">Select Position</option>
                                        <option th:each="pos : ${positions}" th:value="${pos.id}" th:text="${pos.positionName}">Position</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="employmentType" class="form-label">Employment Type *</label>
                                    <select class="form-select" id="employmentType" th:field="*{employmentType}" required>
                                        <option value="">Select Type</option>
                                        <option value="FULL_TIME">Full Time</option>
                                        <option value="PART_TIME">Part Time</option>
                                        <option value="CONTRACT">Contract</option>
                                        <option value="INTERNSHIP">Internship</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="experienceLevel" class="form-label">Experience Level *</label>
                                    <select class="form-select" id="experienceLevel" th:field="*{experienceLevel}" required>
                                        <option value="">Select Level</option>
                                        <option value="ENTRY">Entry Level</option>
                                        <option value="MID">Mid Level</option>
                                        <option value="SENIOR">Senior Level</option>
                                        <option value="EXECUTIVE">Executive</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="location" class="form-label">Location *</label>
                                    <input type="text" class="form-control" id="location" th:field="*{location}" required>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="remoteAllowed" th:field="*{remoteAllowed}">
                                    <label class="form-check-label" for="remoteAllowed">Remote work allowed</label>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="salaryMin" class="form-label">Minimum Salary</label>
                                        <input type="number" class="form-control" id="salaryMin" th:field="*{salaryMin}" min="0" step="100">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="salaryMax" class="form-label">Maximum Salary</label>
                                        <input type="number" class="form-control" id="salaryMax" th:field="*{salaryMax}" min="0" step="100">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="closingDate" class="form-label">Application Closing Date</label>
                                    <input type="date" class="form-control" id="closingDate" th:field="*{closingDate}">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Job Description *</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="6" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="requirements" class="form-label">Requirements *</label>
                            <textarea class="form-control" id="requirements" th:field="*{requirements}" rows="6" required></textarea>
                        </div>

                        <div class="d-flex justify-content-between border-top pt-3">
                            <a th:href="@{/hiring/jobs/{id}(id=${job.id})}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
