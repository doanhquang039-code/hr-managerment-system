<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Postings - Hiring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/hiring-sidebar :: sidebar"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-briefcase me-2"></i>Job Postings</h1>
                <a th:href="@{/hiring/jobs/create}" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i>Create Job
                </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card border-success"><div class="card-body">
                        <small class="text-muted">Active Jobs</small>
                        <h3 class="text-success mb-0" th:text="${activeJobs}">0</h3>
                    </div></div>
                </div>
                <div class="col-md-3">
                    <div class="card border-warning"><div class="card-body">
                        <small class="text-muted">Draft Jobs</small>
                        <h3 class="text-warning mb-0" th:text="${draftJobs}">0</h3>
                    </div></div>
                </div>
                <div class="col-md-3">
                    <div class="card border-secondary"><div class="card-body">
                        <small class="text-muted">Closed Jobs</small>
                        <h3 class="text-secondary mb-0" th:text="${closedJobs}">0</h3>
                    </div></div>
                </div>
                <div class="col-md-3">
                    <div class="card border-info"><div class="card-body">
                        <small class="text-muted">Applications</small>
                        <h3 class="text-info mb-0" th:text="${totalApplications}">0</h3>
                    </div></div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" class="row g-3 align-items-end">
                        <div class="col-lg-3">
                            <label class="form-label" for="search">Search</label>
                            <input id="search" name="search" class="form-control" th:value="${searchKeyword}"
                                   placeholder="Title, department, location...">
                        </div>
                        <div class="col-lg-2">
                            <label class="form-label" for="status">Status</label>
                            <select id="status" name="status" class="form-select">
                                <option value="">All</option>
                                <option value="DRAFT" th:selected="${selectedStatus == 'DRAFT'}">Draft</option>
                                <option value="ACTIVE" th:selected="${selectedStatus == 'ACTIVE'}">Active</option>
                                <option value="CLOSED" th:selected="${selectedStatus == 'CLOSED'}">Closed</option>
                                <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Cancelled</option>
                            </select>
                        </div>
                        <div class="col-lg-2">
                            <label class="form-label" for="employmentType">Type</label>
                            <select id="employmentType" name="employmentType" class="form-select">
                                <option value="">All</option>
                                <option value="FULL_TIME" th:selected="${selectedEmploymentType == 'FULL_TIME'}">Full time</option>
                                <option value="PART_TIME" th:selected="${selectedEmploymentType == 'PART_TIME'}">Part time</option>
                                <option value="CONTRACT" th:selected="${selectedEmploymentType == 'CONTRACT'}">Contract</option>
                                <option value="INTERNSHIP" th:selected="${selectedEmploymentType == 'INTERNSHIP'}">Internship</option>
                            </select>
                        </div>
                        <div class="col-lg-2">
                            <label class="form-label" for="experienceLevel">Level</label>
                            <select id="experienceLevel" name="experienceLevel" class="form-select">
                                <option value="">All</option>
                                <option value="ENTRY" th:selected="${selectedExperienceLevel == 'ENTRY'}">Entry</option>
                                <option value="MID" th:selected="${selectedExperienceLevel == 'MID'}">Mid</option>
                                <option value="SENIOR" th:selected="${selectedExperienceLevel == 'SENIOR'}">Senior</option>
                                <option value="EXECUTIVE" th:selected="${selectedExperienceLevel == 'EXECUTIVE'}">Executive</option>
                            </select>
                        </div>
                        <div class="col-lg-3">
                            <label class="form-label" for="departmentId">Department</label>
                            <select id="departmentId" name="departmentId" class="form-select">
                                <option value="">All</option>
                                <option th:each="department : ${departments}" th:value="${department.id}"
                                        th:selected="${department.id == selectedDepartmentId}"
                                        th:text="${department.departmentName}">Department</option>
                            </select>
                        </div>
                        <input type="hidden" name="sortBy" th:value="${sortField}">
                        <input type="hidden" name="sortDir" th:value="${sortDir}">
                        <div class="col-lg-3">
                            <button class="btn btn-primary me-2" type="submit"><i class="bi bi-search me-1"></i>Filter</button>
                            <a th:href="@{/hiring/jobs}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>Clear</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Jobs</h5>
                    <span class="text-muted small" th:text="${totalItems} + ' result(s)'">0 result(s)</span>
                </div>
                <div class="card-body">
                    <div th:if="${jobs.empty}" class="text-center py-5">
                        <i class="bi bi-inbox fs-1 text-muted"></i>
                        <p class="text-muted mt-2">No job postings found.</p>
                    </div>

                    <div class="table-responsive" th:if="${!jobs.empty}">
                        <table class="table table-hover align-middle">
                            <thead>
                            <tr>
                                <th><a th:href="@{/hiring/jobs(search=${searchKeyword},status=${selectedStatus},employmentType=${selectedEmploymentType},experienceLevel=${selectedExperienceLevel},departmentId=${selectedDepartmentId},sortBy='title',sortDir=${sortField == 'title' ? reverseSortDir : 'asc'})}">Title</a></th>
                                <th>Department</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th><a th:href="@{/hiring/jobs(search=${searchKeyword},status=${selectedStatus},employmentType=${selectedEmploymentType},experienceLevel=${selectedExperienceLevel},departmentId=${selectedDepartmentId},sortBy='applicationsCount',sortDir=${sortField == 'applicationsCount' ? reverseSortDir : 'desc'})}">Applications</a></th>
                                <th><a th:href="@{/hiring/jobs(search=${searchKeyword},status=${selectedStatus},employmentType=${selectedEmploymentType},experienceLevel=${selectedExperienceLevel},departmentId=${selectedDepartmentId},sortBy='closingDate',sortDir=${sortField == 'closingDate' ? reverseSortDir : 'asc'})}">Closing</a></th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="job : ${jobs}">
                                <td>
                                    <div class="fw-semibold" th:text="${job.title}">Job title</div>
                                    <small class="text-muted" th:text="${job.location ?: 'No location'}">Location</small>
                                </td>
                                <td th:text="${job.department != null ? job.department.departmentName : 'N/A'}">Department</td>
                                <td>
                                    <span class="badge text-bg-info" th:text="${job.employmentType ?: 'N/A'}">FULL_TIME</span>
                                    <span class="badge text-bg-light" th:text="${job.experienceLevel ?: 'N/A'}">MID</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${job.status == 'ACTIVE'} ? 'text-bg-success' : (${job.status == 'DRAFT'} ? 'text-bg-warning' : (${job.status == 'CLOSED'} ? 'text-bg-secondary' : 'text-bg-danger'))"
                                          th:text="${job.status}">ACTIVE</span>
                                </td>
                                <td th:text="${job.applicationsCount != null ? job.applicationsCount : 0}">0</td>
                                <td th:text="${job.closingDate != null ? #temporals.format(job.closingDate, 'dd/MM/yyyy') : 'N/A'}">N/A</td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/hiring/jobs/{id}(id=${job.id})}" class="btn btn-outline-primary"><i class="bi bi-eye"></i></a>
                                        <a th:href="@{/hiring/jobs/{id}/edit(id=${job.id})}" class="btn btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                                        <form th:if="${job.status == 'DRAFT'}" th:action="@{/hiring/jobs/{id}/publish(id=${job.id})}" method="post">
                                            <button class="btn btn-outline-success" type="submit"><i class="bi bi-upload"></i></button>
                                        </form>
                                        <form th:if="${job.status == 'ACTIVE'}" th:action="@{/hiring/jobs/{id}/close(id=${job.id})}" method="post">
                                            <button class="btn btn-outline-warning" type="submit"><i class="bi bi-lock"></i></button>
                                        </form>
                                        <form th:action="@{/hiring/jobs/{id}/delete(id=${job.id})}" method="post"
                                              onsubmit="return confirm('Delete this job posting?');">
                                            <button class="btn btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <nav th:if="${totalPages > 1}" class="mt-3">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/hiring/jobs(page=${currentPage - 1},size=10,search=${searchKeyword},status=${selectedStatus},employmentType=${selectedEmploymentType},experienceLevel=${selectedExperienceLevel},departmentId=${selectedDepartmentId},sortBy=${sortField},sortDir=${sortDir})}">Previous</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:text="${i + 1}"
                                   th:href="@{/hiring/jobs(page=${i},size=10,search=${searchKeyword},status=${selectedStatus},employmentType=${selectedEmploymentType},experienceLevel=${selectedExperienceLevel},departmentId=${selectedDepartmentId},sortBy=${sortField},sortDir=${sortDir})}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/hiring/jobs(page=${currentPage + 1},size=10,search=${searchKeyword},status=${selectedStatus},employmentType=${selectedEmploymentType},experienceLevel=${selectedExperienceLevel},departmentId=${selectedDepartmentId},sortBy=${sortField},sortDir=${sortDir})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/hrms-datatable.js}"></script>
</body>
</html>
