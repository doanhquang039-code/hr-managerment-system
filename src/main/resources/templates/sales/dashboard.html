<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background:#f4f7fb; color:#0f172a; }
        .sales-shell { min-height:100vh; padding:28px; }
        .page-head { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:22px; }
        .page-head h1 { font-weight:800; margin:0; }
        .metric { background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:20px; height:100%; }
        .metric .icon { width:46px; height:46px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.3rem; }
        .panel { background:#fff; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden; }
        .panel-head { padding:16px 18px; border-bottom:1px solid #eef2f7; display:flex; justify-content:space-between; align-items:center; }
    </style>
</head>
<body>
<main class="sales-shell">
    <section class="page-head">
        <div>
            <div class="text-muted small">HRMS / Sales</div>
            <h1><i class="bi bi-shop me-2"></i>B&#225;n h&#224;ng</h1>
        </div>
        <a class="btn btn-outline-secondary" href="/admin/dashboard"><i class="bi bi-arrow-left"></i> Dashboard</a>
    </section>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <a class="metric text-decoration-none text-dark d-block" href="/sales/products">
                <div class="d-flex align-items-center gap-3">
                    <div class="icon" style="background:#2563eb"><i class="bi bi-box-seam"></i></div>
                    <div><div class="text-muted">S&#7843;n ph&#7849;m</div><h3 class="mb-0" th:text="${#lists.size(products)}">0</h3></div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a class="metric text-decoration-none text-dark d-block" href="/sales/customers">
                <div class="d-flex align-items-center gap-3">
                    <div class="icon" style="background:#0f766e"><i class="bi bi-person-hearts"></i></div>
                    <div><div class="text-muted">Kh&#225;ch h&#224;ng</div><h3 class="mb-0" th:text="${#lists.size(customers)}">0</h3></div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a class="metric text-decoration-none text-dark d-block" href="/sales/orders">
                <div class="d-flex align-items-center gap-3">
                    <div class="icon" style="background:#f59e0b"><i class="bi bi-receipt"></i></div>
                    <div><div class="text-muted">&#272;&#417;n h&#224;ng</div><h3 class="mb-0" th:text="${#lists.size(orders)}">0</h3></div>
                </div>
            </a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="panel">
                <div class="panel-head">
                    <strong>&#272;&#417;n h&#224;ng g&#7847;n &#273;&#226;y</strong>
                    <a class="btn btn-sm btn-primary" href="/sales/orders/create"><i class="bi bi-plus-lg"></i> T&#7841;o &#273;&#417;n</a>
                </div>
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead><tr><th>M&#227;</th><th>Kh&#225;ch</th><th>T&#7893;ng</th><th>Tr&#7841;ng th&#225;i</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(orders)}"><td colspan="4" class="text-center text-muted py-4">Ch&#432;a c&#243; &#273;&#417;n h&#224;ng.</td></tr>
                        <tr th:each="o : ${orders}">
                            <td th:text="${o.orderCode}">SO</td>
                            <td th:text="${o.customer != null ? o.customer.name : 'N/A'}">Customer</td>
                            <td th:text="${#numbers.formatDecimal(o.totalAmount,1,'COMMA',0,'POINT')}">0</td>
                            <td><span class="badge text-bg-light" th:text="${o.status}">PENDING</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="panel">
                <div class="panel-head"><strong>Thao t&#225;c nhanh</strong></div>
                <div class="p-3 d-grid gap-2">
                    <a class="btn btn-outline-primary" href="/sales/products/create"><i class="bi bi-plus-circle"></i> Th&#234;m s&#7843;n ph&#7849;m</a>
                    <a class="btn btn-outline-success" href="/sales/customers/create"><i class="bi bi-person-plus"></i> Th&#234;m kh&#225;ch h&#224;ng</a>
                    <a class="btn btn-outline-warning" href="/sales/orders/create"><i class="bi bi-receipt-cutoff"></i> T&#7841;o &#273;&#417;n h&#224;ng</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
