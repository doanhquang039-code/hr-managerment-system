<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khách hàng - Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="background:#f4f7fb">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><div class="text-muted small">Sales</div><h1 class="h3 fw-bold">Kh&#225;ch h&#224;ng</h1></div>
        <div><a href="/sales" class="btn btn-outline-secondary">Sales</a> <a href="/sales/customers/create" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Th&#234;m</a></div>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="card"><div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead><tr><th>T&#234;n</th><th>Email</th><th>S&#272;T</th><th>&#272;&#7883;a ch&#7881;</th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(customers)}"><td colspan="4" class="text-center text-muted py-4">Ch&#432;a c&#243; kh&#225;ch h&#224;ng.</td></tr>
            <tr th:each="c : ${customers}"><td class="fw-bold" th:text="${c.name}">Name</td><td th:text="${c.email}"></td><td th:text="${c.phone}"></td><td th:text="${c.address}"></td></tr>
            </tbody>
        </table>
    </div></div>
</main>
</body>
</html>
