<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - HRMS Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background:#eef3f8; }
        .cart-hero { background:linear-gradient(135deg,#0f766e,#2563eb); color:#fff; border-radius:10px; padding:22px 26px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
        .cart-hero h1 { font-size:1.5rem; font-weight:850; margin:0; }
        .cart-card { background:#fff; border:1px solid #e2e8f0; border-radius:10px; box-shadow:0 8px 24px rgba(15,23,42,.06); }
        .cart-item { border-bottom:1px solid #f1f5f9; padding:16px 20px; }
        .cart-item:last-child { border-bottom:none; }
        .product-thumb { width:60px; height:60px; border-radius:8px; background:linear-gradient(135deg,#dbeafe,#ccfbf1); display:flex; align-items:center; justify-content:center; flex:0 0 auto; overflow:hidden; }
        .product-thumb img { width:100%; height:100%; object-fit:cover; }
        .qty-input { width:70px; text-align:center; border:1px solid #d1d5db; border-radius:6px; padding:4px 8px; }
        .price-col { color:#0f766e; font-weight:800; font-size:1.1rem; }

        /* Checkout panel */
        .checkout-panel { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:22px; box-shadow:0 8px 24px rgba(15,23,42,.06); position:sticky; top:20px; }
        .total-display { font-size:1.6rem; font-weight:900; color:#0f766e; }
        .payment-opt { border:2px solid #e2e8f0; border-radius:8px; padding:10px 14px; cursor:pointer; transition:.15s; margin-bottom:8px; }
        .payment-opt:hover { border-color:#0f766e; }
        .payment-opt input[type=radio]:checked + .opt-label { color:#0f766e; font-weight:700; }
        .payment-opt.selected { border-color:#0f766e; background:#f0fdf4; }

        /* QR panel inside checkout */
        .qr-checkout-panel { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:14px; margin-top:12px; }
        .qr-checkout-img { width:130px; height:130px; border-radius:8px; overflow:hidden; background:#fff; border:1px solid #d1fae5; display:flex; align-items:center; justify-content:center; }
        .qr-checkout-img img { width:100%; height:100%; object-fit:contain; }
        .copy-btn { background:#0f766e; color:#fff; border:none; border-radius:5px; padding:4px 12px; font-size:.8rem; font-weight:700; }

        .empty-cart { text-align:center; padding:60px 20px; color:#94a3b8; }
        .btn-checkout { background:linear-gradient(135deg,#0f766e,#2563eb); border:none; color:#fff; font-weight:800; border-radius:10px; padding:14px; font-size:1.05rem; width:100%; transition:.2s; }
        .btn-checkout:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(37,99,235,.3); color:#fff; }
    </style>
</head>
<body>
<main class="container py-4">

    <!-- Hero -->
    <div class="cart-hero">
        <div>
            <div style="font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.8">HRMS Marketplace</div>
            <h1><i class="bi bi-cart3 me-2"></i>Giỏ hàng của bạn</h1>
        </div>
        <a href="/sales/products" class="btn btn-light"><i class="bi bi-arrow-left me-1"></i>Tiếp tục mua</a>
    </div>

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible" th:text="${success}"><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible" th:text="${error}"><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

    <!-- Empty cart -->
    <div th:if="${cart.empty}" class="cart-card">
        <div class="empty-cart">
            <i class="bi bi-cart-x" style="font-size:4rem;"></i>
            <h2 class="h4 mt-3 fw-bold text-muted">Giỏ hàng trống</h2>
            <p class="text-muted">Hãy thêm sản phẩm vào giỏ hàng của bạn</p>
            <a href="/sales/products" class="btn btn-primary mt-2"><i class="bi bi-shop me-1"></i>Khám phá sản phẩm</a>
        </div>
    </div>

    <!-- Cart with items -->
    <div th:if="${!cart.empty}" class="row g-4">
        <!-- Left: Cart items -->
        <div class="col-lg-8">
            <div class="cart-card">
                <!-- Item list -->
                <div th:each="item : ${cart.items}" class="cart-item">
                    <div class="d-flex gap-3 align-items-center">
                        <!-- Thumbnail -->
                        <div class="product-thumb">
                            <img th:if="${item.imageUrl != null and !#strings.isEmpty(item.imageUrl)}"
                                 th:src="${item.imageUrl}" alt="">
                            <i th:if="${item.imageUrl == null or #strings.isEmpty(item.imageUrl)}"
                               class="bi bi-box-seam text-muted fs-4"></i>
                        </div>
                        <!-- Info -->
                        <div class="flex-1" style="min-width:0">
                            <div class="fw-bold text-truncate" th:text="${item.productName}">Product</div>
                            <div class="small text-muted" th:text="'Người bán: ' + ${item.sellerName}">Seller</div>
                            <div class="price-col" th:text="${#numbers.formatDecimal(item.unitPrice,1,'COMMA',0,'POINT') + ' ₫'}">0₫</div>
                        </div>
                        <!-- Qty update form -->
                        <form th:action="@{/sales/cart/update}" method="post" class="d-flex align-items-center gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="productId" th:value="${item.productId}">
                            <input type="number" name="quantity" th:value="${item.quantity}" min="1"
                                   class="qty-input" onchange="this.form.submit()">
                        </form>
                        <!-- Line total -->
                        <div class="text-end" style="min-width:90px">
                            <div class="fw-bold text-dark"
                                 th:text="${#numbers.formatDecimal(item.lineTotal,1,'COMMA',0,'POINT') + ' ₫'}">0₫</div>
                        </div>
                        <!-- Remove -->
                        <form th:action="@{/sales/cart/remove/{id}(id=${item.productId})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger" title="Xóa khỏi giỏ">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- QR cards for each item (nếu có QR) -->
            <div th:each="item : ${cart.items}"
                 th:if="${item.qrImageUrl != null and !#strings.isEmpty(item.qrImageUrl)}">
                <div class="cart-card mt-3 p-3">
                    <div class="small fw-bold text-muted mb-2">
                        <i class="bi bi-qr-code me-1 text-success"></i>QR thanh toán cho:
                        <strong th:text="${item.productName}">Product</strong>
                    </div>
                    <div class="d-flex gap-3 align-items-center flex-wrap">
                        <div class="qr-checkout-img">
                            <img th:src="${item.qrImageUrl}" alt="QR">
                        </div>
                        <div>
                            <div class="small text-muted mb-1">Số tiền:</div>
                            <div class="fw-bold text-success fs-5"
                                 th:text="${#numbers.formatDecimal(item.lineTotal,1,'COMMA',0,'POINT') + ' ₫'}">0₫</div>
                            <div th:if="${item.paymentNote != null and !#strings.isEmpty(item.paymentNote)}" class="mt-2">
                                <div class="small text-muted mb-1">Nội dung CK:</div>
                                <div class="d-flex gap-2 align-items-center">
                                    <code class="bg-light px-2 py-1 rounded" th:id="'note-' + ${item.productId}"
                                          th:text="${item.paymentNote}">note</code>
                                    <button class="copy-btn" th:onclick="'copyNote(\'' + ${item.productId} + '\')'">Copy</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Checkout panel -->
        <div class="col-lg-4">
            <div class="checkout-panel">
                <h2 class="h5 fw-bold mb-3">Tổng đơn hàng</h2>

                <div class="d-flex justify-content-between mb-1">
                    <span class="text-muted">Số sản phẩm:</span>
                    <span class="fw-bold" th:text="${cart.totalItems}">0</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-muted">Tổng tiền:</span>
                    <span class="total-display" th:text="${#numbers.formatDecimal(cart.totalAmount,1,'COMMA',0,'POINT') + ' ₫'}">0₫</span>
                </div>

                <hr>

                <form th:action="@{/sales/cart/checkout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Customer select -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Khách hàng <span class="text-danger">*</span></label>
                        <select class="form-select" name="customerId" required>
                            <option value="">-- Chọn khách hàng --</option>
                            <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}">Customer</option>
                        </select>
                        <div class="form-text">Chưa có? <a href="/sales/customers/create" target="_blank">Thêm khách hàng</a></div>
                    </div>

                    <!-- Payment method -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Phương thức thanh toán</label>
                        <label class="payment-opt d-flex align-items-center gap-2" id="opt-cod"
                               onclick="selectPayment('COD')">
                            <input type="radio" name="paymentMethod" value="COD" checked class="me-1"> 💵
                            <span class="opt-label">Tiền mặt (COD)</span>
                        </label>
                        <label class="payment-opt d-flex align-items-center gap-2" id="opt-banking"
                               onclick="selectPayment('BANKING')">
                            <input type="radio" name="paymentMethod" value="BANKING" class="me-1"> 🏦
                            <span class="opt-label">Chuyển khoản Banking / VietQR</span>
                        </label>
                        <label class="payment-opt d-flex align-items-center gap-2" id="opt-momo"
                               onclick="selectPayment('MOMO')">
                            <input type="radio" name="paymentMethod" value="MOMO" class="me-1"> 🍑
                            <span class="opt-label">MoMo</span>
                        </label>
                        <label class="payment-opt d-flex align-items-center gap-2" id="opt-zalopay"
                               onclick="selectPayment('ZALOPAY')">
                            <input type="radio" name="paymentMethod" value="ZALOPAY" class="me-1"> 💙
                            <span class="opt-label">ZaloPay</span>
                        </label>
                    </div>

                    <!-- Buyer note -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Ghi chú</label>
                        <textarea class="form-control" name="buyerNote" rows="2"
                                  placeholder="Ghi chú cho người bán..."></textarea>
                    </div>

                    <button type="submit" class="btn-checkout">
                        <i class="bi bi-bag-check me-1"></i>Đặt hàng ngay
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function selectPayment(val) {
    ['COD','BANKING','MOMO','ZALOPAY'].forEach(p => {
        const el = document.getElementById('opt-' + p.toLowerCase());
        if (el) el.classList.remove('selected');
    });
    const el = document.getElementById('opt-' + val.toLowerCase());
    if (el) el.classList.add('selected');
}
function copyNote(productId) {
    const el = document.getElementById('note-' + productId);
    if (!el) return;
    navigator.clipboard.writeText(el.textContent.trim()).then(() => {
        alert('Đã copy nội dung chuyển khoản!');
    });
}
// Init
selectPayment('COD');
</script>
</body>
</html>
