<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tạo đơn hàng - Sales</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body style="background:#f4f7fb">
<main class="container py-4">
    <h1 class="h3 fw-bold mb-3">T&#7841;o &#273;&#417;n h&#224;ng</h1>
    <div th:if="${#lists.isEmpty(customers)}" class="alert alert-warning">
        Chua co khach hang nao. Vui long tao khach hang truoc khi tao don.
        <a href="/sales/customers/create" class="alert-link">Tao khach hang</a>
    </div>
    <div th:if="${#lists.isEmpty(products)}" class="alert alert-warning">
        Chua co san pham da duyet de tao don. Manager/Admin can duyet san pham trong muc
        <a href="/sales/products" class="alert-link">San pham cong ty</a>.
    </div>
    <form class="card" th:action="@{/sales/orders/create}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="card-body row g-3">
            <div class="col-md-6">
                <label class="form-label">Kh&#225;ch h&#224;ng</label>
                <select class="form-select" name="customerId" required>
                    <option value="" disabled selected>Chon khach hang</option>
                    <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}">Customer</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">S&#7843;n ph&#7849;m</label>
                <select class="form-select" name="productId" required>
                    <option value="" disabled selected>Chon san pham da duyet</option>
                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' - ton: ' + p.stockQuantity}">Product</option>
                </select>
            </div>
            <div class="col-md-3"><label class="form-label">S&#7889; l&#432;&#7907;ng</label><input class="form-control" type="number" name="quantity" value="1" min="1" required></div>
            <div class="col-12"><label class="form-label">Ghi ch&#250;</label><textarea class="form-control" name="notes" rows="3"></textarea></div>
            <div class="col-12">
                <button class="btn btn-primary" th:disabled="${#lists.isEmpty(customers) or #lists.isEmpty(products)}">T&#7841;o &#273;&#417;n</button>
                <a class="btn btn-outline-secondary" href="/sales/orders">H&#7911;y</a>
            </div>
        </div>
    </form>
</main>
</body>
</html>
