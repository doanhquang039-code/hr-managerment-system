<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Thêm khách hàng - Sales</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body style="background:#f4f7fb">
<main class="container py-4">
    <h1 class="h3 fw-bold mb-3">Th&#234;m kh&#225;ch h&#224;ng</h1>
    <form class="card" th:action="@{/sales/customers/save}" method="post" th:object="${customer}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="card-body row g-3">
            <div class="col-md-6"><label class="form-label">T&#234;n</label><input class="form-control" th:field="*{name}" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}"></div>
            <div class="col-md-4"><label class="form-label">S&#272;T</label><input class="form-control" th:field="*{phone}"></div>
            <div class="col-md-8"><label class="form-label">&#272;&#7883;a ch&#7881;</label><input class="form-control" th:field="*{address}"></div>
            <div class="col-12"><button class="btn btn-primary">L&#432;u</button> <a class="btn btn-outline-secondary" href="/sales/customers">H&#7911;y</a></div>
        </div>
    </form>
</main>
</body>
</html>
