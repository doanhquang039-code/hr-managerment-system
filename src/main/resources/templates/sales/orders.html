<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng - HRMS Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background:#eef3f8; }
        .page-hero { background:linear-gradient(135deg,#1e3a5f,#0f766e); color:#fff; border-radius:10px; padding:22px 26px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
        .page-hero h1 { font-size:1.4rem; font-weight:850; margin:0; }
        .payment-badge { font-size:.75rem; font-weight:700; padding:3px 9px; border-radius:20px; }
        .pm-cod { background:#fef9c3; color:#854d0e; }
        .pm-banking { background:#dbeafe; color:#1d4ed8; }
        .pm-momo { background:#fce7f3; color:#be185d; }
        .pm-zalopay { background:#e0f2fe; color:#0369a1; }
    </style>
</head>
<body>
<main class="container py-4">
    <div class="page-hero">
        <div>
            <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.8">HRMS Sales</div>
            <h1><i class="bi bi-receipt me-2"></i>Đơn hàng</h1>
        </div>
        <div class="d-flex gap-2">
            <a href="/home" class="btn btn-outline-light btn-sm"><i class="bi bi-house-door me-1"></i> Trang chủ</a>
            <a href="/sales" class="btn btn-light btn-sm">← Sales</a>
            <a th:if="${currentRole == 'ADMIN' or currentRole == 'MANAGER'}" href="/sales/orders?status=PENDING" class="btn btn-warning btn-sm">
                <i class="bi bi-hourglass-split"></i> Đơn chờ duyệt
                <span class="badge text-bg-dark" th:if="${pendingOrders != null and #lists.size(pendingOrders) > 0}" th:text="${#lists.size(pendingOrders)}">0</span>
            </a>
            <a href="/sales/cart" class="btn btn-outline-light btn-sm position-relative">
                <i class="bi bi-cart3"></i> Giỏ hàng
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      th:if="${cartCount > 0}" th:text="${cartCount}">0</span>
            </a>
            <a href="/sales/orders/create" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Tạo đơn</a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Mã đơn</th>
                        <th>Khách hàng</th>
                        <th>Tổng tiền</th>
                        <th>Thanh toán</th>
                        <th>Ghi chú người mua</th>
                        <th>Trạng thái</th>
                        <th>Cập nhật</th>
                    </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="7" class="text-center text-muted py-4">Chưa có đơn hàng.</td>
                </tr>
                <tr th:each="o : ${orders}">
                    <td class="fw-bold">
                        <a th:href="@{/sales/orders/{id}(id=${o.id})}" th:text="${o.orderCode}">SO</a>
                    </td>
                    <td th:text="${o.customer != null ? o.customer.name : 'N/A'}">Customer</td>
                    <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(o.totalAmount,1,'COMMA',0,'POINT') + ' ₫'}">0₫</td>
                    <td>
                        <div class="d-flex flex-column gap-1">
                            <span class="payment-badge"
                                  th:classappend="${o.paymentMethod == 'MOMO' ? ' pm-momo' : (o.paymentMethod == 'ZALOPAY' ? ' pm-zalopay' : (o.paymentMethod == 'BANKING' ? ' pm-banking' : ' pm-cod'))}"
                                  th:text="${o.paymentMethod == 'MOMO' ? '🍑 MoMo' : (o.paymentMethod == 'ZALOPAY' ? '💙 ZaloPay' : (o.paymentMethod == 'BANKING' ? '🏦 Banking' : '💵 COD'))}">
                                COD
                            </span>
                            
                            <!-- Minh chứng thanh toán -->
                            <a th:if="${o.paymentProofUrl != null}" th:href="${o.paymentProofUrl}" target="_blank" class="badge bg-success text-decoration-none" style="font-size:0.7rem; display:inline-block;">
                                <i class="bi bi-image"></i> Xem minh chứng
                            </a>
                            
                            <!-- Form upload ảnh nếu chưa có -->
                            <form th:if="${o.paymentProofUrl == null and o.paymentMethod != 'COD' and o.status == 'PENDING'}"
                                  th:action="@{/sales/orders/{id}/upload-proof(id=${o.id})}" method="post" enctype="multipart/form-data"
                                  class="d-flex align-items-center gap-1 mt-1">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="file" name="file" class="form-control form-control-sm" style="font-size:0.65rem; max-width:110px; padding:1px 3px;" accept="image/*" required>
                                <button class="btn btn-sm btn-primary py-0 px-1" style="font-size:0.7rem;" title="Tải ảnh chuyển tiền lên"><i class="bi bi-upload"></i></button>
                            </form>
                        </div>
                    </td>
                    <td>
                        <span th:if="${o.buyerNote != null and !#strings.isEmpty(o.buyerNote)}"
                              class="text-muted small" th:text="${#strings.abbreviate(o.buyerNote, 50)}">Note</span>
                        <span th:if="${o.buyerNote == null or #strings.isEmpty(o.buyerNote)}" class="text-muted">–</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${o.status == 'APPROVED' or o.status == 'PAID' ? ' text-bg-success' : (o.status == 'CANCELLED' ? ' text-bg-danger' : (o.status == 'SHIPPED' ? ' text-bg-info' : ' text-bg-warning'))}"
                              th:text="${o.status}">PENDING</span>
                    </td>
                    <td>
                        <div class="d-flex gap-2 mb-2" th:if="${(currentRole == 'ADMIN' or currentRole == 'MANAGER') and o.status == 'PENDING'}">
                            <form th:action="@{/sales/orders/{id}/approve(id=${o.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-sm btn-success"><i class="bi bi-check2"></i> Duyệt</button>
                            </form>
                            <form th:action="@{/sales/orders/{id}/reject(id=${o.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-x-lg"></i> Từ chối</button>
                            </form>
                        </div>
                        <form th:action="@{/sales/orders/{id}/status(id=${o.id})}" method="post" class="d-flex gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <select class="form-select form-select-sm" name="status">
                                <option value="PENDING" th:selected="${o.status == 'PENDING'}">PENDING</option>
                                <option value="APPROVED" th:selected="${o.status == 'APPROVED'}">APPROVED</option>
                                <option value="PAID" th:selected="${o.status == 'PAID'}">PAID</option>
                                <option value="SHIPPED" th:selected="${o.status == 'SHIPPED'}">SHIPPED</option>
                                <option value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">CANCELLED</option>
                            </select>
                            <button class="btn btn-sm btn-outline-primary">Lưu</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
