<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đơn hàng - Sales</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head>
<body style="background:#f4f7fb">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3"><div><div class="text-muted small">Sales</div><h1 class="h3 fw-bold">&#272;&#417;n h&#224;ng</h1></div><div><a href="/sales" class="btn btn-outline-secondary">Sales</a> <a href="/sales/orders/create" class="btn btn-primary"><i class="bi bi-plus-lg"></i> T&#7841;o &#273;&#417;n</a></div></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card"><div class="table-responsive"><table class="table table-hover mb-0">
        <thead><tr><th>M&#227;</th><th>Kh&#225;ch</th><th>T&#7893;ng</th><th>Tr&#7841;ng th&#225;i</th><th>C&#7853;p nh&#7853;t</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(orders)}"><td colspan="5" class="text-center text-muted py-4">Ch&#432;a c&#243; &#273;&#417;n h&#224;ng.</td></tr>
        <tr th:each="o : ${orders}">
            <td class="fw-bold" th:text="${o.orderCode}">SO</td><td th:text="${o.customer != null ? o.customer.name : 'N/A'}">Customer</td><td th:text="${#numbers.formatDecimal(o.totalAmount,1,'COMMA',0,'POINT')}">0</td>
            <td><span class="badge text-bg-light" th:text="${o.status}">PENDING</span></td>
            <td>
                <form th:action="@{/sales/orders/{id}/status(id=${o.id})}" method="post" class="d-flex gap-2">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <select class="form-select form-select-sm" name="status">
                        <option value="PENDING" th:selected="${o.status == 'PENDING'}">PENDING</option>
                        <option value="PAID" th:selected="${o.status == 'PAID'}">PAID</option>
                        <option value="SHIPPED" th:selected="${o.status == 'SHIPPED'}">SHIPPED</option>
                        <option value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">CANCELLED</option>
                    </select>
                    <button class="btn btn-sm btn-outline-primary">L&#432;u</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table></div></div>
</main>
</body>
</html>
