<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm - Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f4f7fb">
<main class="container py-4">
    <h1 class="h3 fw-bold mb-1">&#272;&#259;ng s&#7843;n ph&#7849;m b&#225;n</h1>
    <p class="text-muted mb-3">S&#7843;n ph&#7849;m c&#7911;a b&#7841;n s&#7869; ch&#7901; Manager duy&#7879;t tr&#432;&#7899;c khi hi&#7875;n th&#7883; c&#244;ng khai.</p>
    <form class="card" th:action="@{/sales/products/save}" method="post" th:object="${product}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="card-body row g-3">
            <div class="col-md-6"><label class="form-label">T&#234;n</label><input class="form-control" th:field="*{name}" required></div>
            <div class="col-md-3"><label class="form-label">SKU</label><input class="form-control" th:field="*{sku}"></div>
            <div class="col-md-3"><label class="form-label">Gi&#225;</label><input class="form-control" type="number" step="1000" min="0" th:field="*{price}" required></div>
            <div class="col-md-3"><label class="form-label">T&#7891;n kho</label><input class="form-control" type="number" min="0" th:field="*{stockQuantity}" required></div>
            <div class="col-12"><label class="form-label">M&#244; t&#7843;</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea></div>
            <div class="col-12"><button class="btn btn-primary">L&#432;u</button> <a class="btn btn-outline-secondary" href="/sales/products">H&#7911;y</a></div>
        </div>
    </form>
</main>
</body>
</html>
