<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background:#eef3f8; }
        .detail-card { background:#fff; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden; box-shadow:0 14px 36px rgba(15,23,42,.08); }
        .product-media { min-height:320px; background:linear-gradient(135deg,#dbeafe,#ccfbf1); display:flex; align-items:center; justify-content:center; }
        .product-media img { width:100%; height:100%; min-height:320px; object-fit:cover; }
    </style>
</head>
<body>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><div class="text-muted small">Sales / Product</div><h1 class="h3 fw-bold mb-0" th:text="${product.name}">Product</h1></div>
        <a href="/sales/products" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Quay l&#7841;i</a>
    </div>

    <section class="detail-card">
        <div class="row g-0">
            <div class="col-lg-5">
                <div class="product-media">
                    <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}" th:src="${product.imageUrl}" alt="">
                    <i th:if="${product.imageUrl == null or #strings.isEmpty(product.imageUrl)}" class="bi bi-box-seam" style="font-size:4rem;color:#0f766e"></i>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="p-4">
                    <div class="d-flex gap-2 mb-3">
                        <span class="badge" th:classappend="${product.approvalStatus == 'APPROVED' ? ' text-bg-success' : (product.approvalStatus == 'REJECTED' ? ' text-bg-danger' : ' text-bg-warning')}" th:text="${product.approvalStatus}">PENDING</span>
                        <span class="badge text-bg-light" th:text="${product.sku}">SKU</span>
                    </div>
                    <h2 class="fw-bold" th:text="${product.name}">Product</h2>
                    <div class="text-muted mb-3">Ng&#432;&#7901;i &#273;&#259;ng: <span th:text="${product.seller != null ? product.seller.fullName : 'N/A'}">Seller</span></div>
                    <div class="display-6 fw-bold text-success mb-2" th:text="${#numbers.formatDecimal(product.price,1,'COMMA',0,'POINT')}">0</div>
                    <div class="mb-4">T&#7891;n kho: <strong th:text="${product.stockQuantity}">0</strong></div>
                    <p class="text-muted" th:text="${product.description != null and !#strings.isEmpty(product.description) ? product.description : 'Chua co mo ta'}">Description</p>
                    <div class="d-flex gap-2 flex-wrap mt-4">
                        <a th:if="${canManage}" class="btn btn-outline-primary" th:href="@{/sales/products/{id}/edit(id=${product.id})}"><i class="bi bi-pencil-square"></i> S&#7917;a</a>
                        <form th:if="${canManage}" th:action="@{/sales/products/{id}/delete(id=${product.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-outline-danger" onclick="return confirm('An san pham nay?')"><i class="bi bi-eye-slash"></i> &#7848;n</button>
                        </form>
                        <form th:if="${currentRole == 'MANAGER' or currentRole == 'ADMIN'}" th:action="@{/sales/products/{id}/approve(id=${product.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-success"><i class="bi bi-check2-circle"></i> Duy&#7879;t</button>
                        </form>
                        <form th:if="${currentRole == 'MANAGER' or currentRole == 'ADMIN'}" th:action="@{/sales/products/{id}/reject(id=${product.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-outline-danger"><i class="bi bi-x-circle"></i> T&#7915; ch&#7889;i</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
