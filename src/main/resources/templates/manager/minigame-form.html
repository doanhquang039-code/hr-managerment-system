<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tao minigame - HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/manager-sidebar :: sidebar"></div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <div>
                    <h1 class="h3 mb-1"><i class="bi bi-controller me-2"></i>T&#7841;o minigame</h1>
                    <div class="text-muted">Manager t&#7841;o c&#226;u h&#7887;i v&#224; qu&#224; cho top 1/2/3.</div>
                </div>
                <a href="/manager/minigame" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Quay l&#7841;i</a>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/manager/minigames/create}" method="post" class="card">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="card-body">
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">T&#234;n minigame</label>
                            <input class="form-control" name="title" required placeholder="VD: Thu thach van hoa team">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Th&#7901;i gian ph&#250;t</label>
                            <input class="form-control" type="number" name="timeLimit" value="5" min="1">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">&#272;i&#7875;m &#273;&#7841;t (%)</label>
                            <input class="form-control" type="number" name="passingScore" value="60" min="0" max="100">
                        </div>
                        <div class="col-12">
                            <label class="form-label">M&#244; t&#7843;</label>
                            <textarea class="form-control" name="description" rows="2"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Qu&#224; top 1</label>
                            <input class="form-control" name="rewardTop1" placeholder="Voucher 200k">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Qu&#224; top 2</label>
                            <input class="form-control" name="rewardTop2" placeholder="Voucher 100k">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Qu&#224; top 3</label>
                            <input class="form-control" name="rewardTop3" placeholder="Huy hieu noi bo">
                        </div>
                    </div>

                    <h2 class="h5 mb-3">C&#226;u h&#7887;i</h2>
                    <div th:each="slot : ${questionSlots}" class="border rounded p-3 mb-3">
                        <label class="form-label fw-bold">C&#226;u <span th:text="${slot}">1</span></label>
                        <input class="form-control mb-2" name="questionText" th:required="${slot == 1}" placeholder="Nhap noi dung cau hoi">
                        <div class="row g-2">
                            <div class="col-md-6"><input class="form-control" name="optionA" placeholder="Dap an A"></div>
                            <div class="col-md-6"><input class="form-control" name="optionB" placeholder="Dap an B"></div>
                            <div class="col-md-6"><input class="form-control" name="optionC" placeholder="Dap an C"></div>
                            <div class="col-md-6"><input class="form-control" name="optionD" placeholder="Dap an D"></div>
                            <div class="col-12"><input class="form-control" name="correctAnswer" placeholder="Nhap dung y het dap an dung"></div>
                        </div>
                    </div>

                    <button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i>L&#432;u minigame</button>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
