<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Detail - HR Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/manager-sidebar :: sidebar"></div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="h2 mb-0"><i class="bi bi-cash-stack me-2"></i>Budget Detail</h1>
                    <div class="text-muted" th:text="${budget.category + ' - ' + budget.month + '/' + budget.year}">TRAINING - 6/2026</div>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/manager/budget/edit/{id}(id=${budget.id})}" class="btn btn-primary">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </a>
                    <a href="/manager/budget" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Back
                    </a>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <div class="text-muted small">Allocated</div>
                            <div class="h3 mb-0" th:text="'$' + ${budget.allocatedBudget}">$0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <div class="text-muted small">Spent</div>
                            <div class="h3 text-warning mb-0" th:text="'$' + ${budget.spentBudget}">$0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <div class="text-muted small">Remaining</div>
                            <div class="h3 mb-0" th:classappend="${budget.overBudget} ? ' text-danger' : ' text-success'" th:text="'$' + ${budget.remainingBudget}">$0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <div class="text-muted small">Utilization</div>
                            <div class="h3 mb-0" th:text="${#numbers.formatDecimal(budget.utilizationPercent, 1, 1)} + '%'">0%</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <strong>Usage</strong>
                        <span class="badge" th:classappend="${budget.status == 'EXCEEDED'} ? 'bg-danger' : (${budget.status == 'ACTIVE'} ? 'bg-success' : 'bg-secondary')" th:text="${budget.status}">ACTIVE</span>
                    </div>
                    <div class="progress" style="height: 12px;">
                        <div class="progress-bar" th:classappend="${budget.utilizationPercent > 90} ? 'bg-danger' : 'bg-success'" th:style="'width: ' + ${budget.utilizationPercent} + '%'"></div>
                    </div>
                    <div class="mt-3 text-muted" th:text="${budget.description ?: 'No description.'}">No description.</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><strong>Add Spending</strong></div>
                <div class="card-body">
                    <form class="row g-3 align-items-end" method="post" th:action="@{/manager/budget/spend/{id}(id=${budget.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="col-md-4">
                            <label class="form-label">Amount ($)</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" name="amount" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Description</label>
                            <input type="text" class="form-control" name="description">
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-success w-100" type="submit"><i class="bi bi-plus-circle me-1"></i>Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
