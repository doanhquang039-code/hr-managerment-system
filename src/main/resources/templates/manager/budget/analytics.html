<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Analytics - HR Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div th:replace="fragments/manager-sidebar :: sidebar"></div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2"><i class="bi bi-graph-up-arrow me-2"></i>Budget Analytics</h1>
                <a href="/manager/budget" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card text-center h-100"><div class="card-body">
                        <div class="text-muted small">Year</div>
                        <div class="h3 mb-0" th:text="${currentYear}">2026</div>
                    </div></div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center h-100"><div class="card-body">
                        <div class="text-muted small">Allocated</div>
                        <div class="h3 mb-0" th:text="'$' + ${#numbers.formatDecimal(budgetStats.totalAllocated, 1, 0)}">$0</div>
                    </div></div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center h-100"><div class="card-body">
                        <div class="text-muted small">Spent</div>
                        <div class="h3 text-warning mb-0" th:text="'$' + ${#numbers.formatDecimal(budgetStats.totalSpent, 1, 0)}">$0</div>
                    </div></div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center h-100"><div class="card-body">
                        <div class="text-muted small">Utilization</div>
                        <div class="h3 mb-0" th:text="${#numbers.formatDecimal(budgetStats.utilizationRate, 1, 1)} + '%'">0%</div>
                    </div></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><strong>Budget Utilization</strong></div>
                <div class="card-body">
                    <div th:if="${allBudgets.empty}" class="text-center text-muted py-4">No budget data available.</div>
                    <div th:each="budget : ${allBudgets}" class="mb-3">
                        <div class="d-flex justify-content-between">
                            <strong th:text="${budget.category + ' - ' + budget.month + '/' + budget.year}">Category</strong>
                            <span th:text="${#numbers.formatDecimal(budget.utilizationPercent, 1, 1)} + '%'">0%</span>
                        </div>
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar" th:classappend="${budget.utilizationPercent > 90} ? 'bg-danger' : (${budget.utilizationPercent > 70} ? 'bg-warning' : 'bg-success')" th:style="'width: ' + ${budget.utilizationPercent} + '%'"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
