<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Meetings - HRMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background:#f6f8fb; color:#111827; }
        .shell { max-width:1100px; margin:0 auto; padding:2rem 1rem 3rem; }
        .panel { background:#fff; border:1px solid #e5e7eb; border-radius:8px; box-shadow:0 10px 28px rgba(15,23,42,.06); }
        .meeting-row { display:grid; grid-template-columns:minmax(0,1fr) 150px 120px; gap:14px; padding:16px; border-bottom:1px solid #eef2f7; align-items:center; }
        .meeting-row:last-child { border-bottom:0; }
        @media (max-width: 767px) { .meeting-row { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<main class="shell">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
        <div>
            <div class="text-uppercase text-primary fw-semibold small mb-1">Group Workspace</div>
            <h1 class="h3 mb-1">Meetings</h1>
            <p class="text-muted mb-0">Meetings visible to your account through group permission.</p>
        </div>
        <a th:href="${groupBasePath}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back</a>
    </div>

    <section class="panel">
        <div class="p-4 border-bottom">
            <h2 class="h5 mb-1">My group meeting view</h2>
            <div class="text-muted small">Showing meetings where you are organizer or participant.</div>
        </div>
        <div th:if="${meetings == null || meetings.isEmpty()}" class="text-center text-muted py-5">
            <i class="bi bi-camera-video d-block mb-2" style="font-size:2rem;"></i>
            No meetings are available for your account yet.
        </div>
        <div th:unless="${meetings == null || meetings.isEmpty()}">
            <div class="meeting-row" th:each="meeting : ${meetings}">
                <div>
                    <div class="fw-bold" th:text="${meeting.title}">Meeting title</div>
                    <div class="small text-muted mt-1" th:text="${meeting.description != null ? meeting.description : 'No description'}">Description</div>
                    <a th:if="${meeting.meetingLink != null && !#strings.isEmpty(meeting.meetingLink)}" th:href="${meeting.meetingLink}" target="_blank" class="small text-decoration-none">Open meeting link</a>
                </div>
                <div class="small text-muted" th:text="${meeting.scheduledTime != null ? #temporals.format(meeting.scheduledTime, 'dd/MM/yyyy HH:mm') : 'Unscheduled'}">10/06/2026 09:00</div>
                <span class="badge text-bg-primary" th:text="${meeting.status != null ? meeting.status : 'SCHEDULED'}">SCHEDULED</span>
            </div>
        </div>
    </section>
</main>
</body>
</html>
