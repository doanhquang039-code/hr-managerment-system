<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display:flex; align-items:center; justify-content:center; margin:0; padding:24px; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        .auth-card { width:100%; max-width:440px; padding:2rem; border-radius:15px; background:#fff; box-shadow:0 10px 25px rgba(0,0,0,.2); }
        .btn-main { background:#764ba2; border:none; color:white; padding:10px; font-weight:600; }
        .btn-main:hover { background:#5a3a8a; color:white; }
    </style>
</head>
<body>
<main class="auth-card">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold">Reset password</h1>
        <p class="text-muted mb-0">Choose a new password for your HRMS account.</p>
    </div>

    <div th:if="${invalidToken}" class="alert alert-danger">
        This reset link is invalid or expired. Please request a new one.
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

    <form th:if="${!invalidToken}" th:action="@{/reset-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">
        <div class="mb-3">
            <label class="form-label fw-semibold">New password</label>
            <input type="password" name="newPassword" class="form-control" required minlength="6" autocomplete="new-password">
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Confirm password</label>
            <input type="password" name="confirmPassword" class="form-control" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-main w-100 rounded-pill">
            <i class="fas fa-key me-1"></i> Update password
        </button>
    </form>

    <div class="text-center mt-4">
        <a th:href="@{/forgot-password}" class="text-decoration-none">Request another link</a>
    </div>
</main>
</body>
</html>
