<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display:flex; align-items:center; justify-content:center; margin:0; padding:24px; font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        .auth-card { width:100%; max-width:440px; padding:2rem; border-radius:15px; background:#fff; box-shadow:0 10px 25px rgba(0,0,0,.2); }
        .btn-main { background:#764ba2; border:none; color:white; padding:10px; font-weight:600; }
        .btn-main:hover { background:#5a3a8a; color:white; }
    </style>
</head>
<body>
<main class="auth-card">
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold">Forgot password</h1>
        <p class="text-muted mb-0">Use email for a reset link, or username to request admin verification.</p>
    </div>

    <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label fw-semibold">Username or email</label>
            <input type="text" name="account" class="form-control" required autocomplete="username" placeholder="name@company.com">
        </div>
        <button type="submit" class="btn btn-main w-100 rounded-pill">
            <i class="fas fa-envelope me-1"></i> Send reset link
        </button>
    </form>

    <div class="text-center mt-4">
        <a th:href="@{/login}" class="text-decoration-none">Back to login</a>
    </div>
</main>
</body>
</html>
