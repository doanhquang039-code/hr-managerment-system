<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tài Sản Của Tôi - HRMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; margin: 0; }
        .sidebar { width: 260px; min-height: 100vh; background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); position: fixed; left: 0; top: 0; z-index: 100; box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
        .sidebar-brand { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .brand-name { color: white; font-weight: 700; font-size: 1rem; }
        .brand-sub { color: #64748b; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
        .sidebar-section-label { color: #475569; font-size: 0.65rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; padding: 12px 20px 4px; }
        .sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 10px 20px; color: #94a3b8; text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar nav a:hover, .sidebar nav a.active { color: white; background: rgba(99,102,241,0.15); border-left-color: #6366f1; }
        .sidebar nav a i { font-size: 1rem; width: 20px; }
        .sidebar-logout { padding: 20px; border-top: 1px solid rgba(255,255,255,0.08); }
        .user-card { padding: 16px 20px; display: flex; align-items: center; gap: 12px; background: rgba(99,102,241,0.1); margin: 16px 12px; border-radius: 12px; }
        .user-av { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; }
        .main-content { margin-left: 260px; padding: 28px 32px; }
        .page-header { margin-bottom: 26px; }
        .page-header h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin: 0; }
        .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
        .asset-card { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.04); transition: all 0.25s; }
        .asset-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.12); }
        .asset-card-header { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f1f5f9; }
        .asset-code { font-weight: 800; font-size: 1rem; color: #0f172a; }
        .asset-status { padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
        .status-active { background: #d1fae5; color: #065f46; }
        .status-returned { background: #f1f5f9; color: #64748b; }
        .asset-card-body { padding: 18px 20px; }
        .asset-name { font-weight: 700; font-size: 1.05rem; color: #1e293b; margin-bottom: 4px; }
        .asset-category { display: inline-block; background: #ede9fe; color: #6366f1; padding: 3px 10px; border-radius: 8px; font-size: 0.72rem; font-weight: 600; margin-bottom: 14px; }
        .asset-info { display: flex; flex-direction: column; gap: 8px; }
        .asset-info-row { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: #64748b; }
        .asset-info-row i { color: #94a3b8; width: 16px; font-size: 0.9rem; }
        .asset-info-row strong { color: #1e293b; }
        .asset-card-footer { padding: 12px 20px; background: #f8fafc; border-top: 1px solid #f1f5f9; font-size: 0.78rem; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
        .empty-state { background: white; border-radius: 20px; padding: 60px; text-align: center; color: #94a3b8; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .stat-bar { display: flex; gap: 14px; margin-bottom: 24px; }
        .stat-item { flex: 1; background: white; border-radius: 14px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.04); text-align: center; }
        .stat-num { font-size: 1.8rem; font-weight: 800; line-height: 1; }
        .stat-lbl { font-size: 0.72rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-top: 4px; }
        .lang-btn { background:rgba(255,255,255,0.08)!important;border:1px solid rgba(255,255,255,0.15)!important;color:#94a3b8!important;border-radius:8px!important;padding:4px 10px!important;font-size:0.75rem!important;font-weight:600!important;cursor:pointer!important;transition:all 0.2s!important; }
        .lang-btn:hover { background:rgba(255,255,255,0.18)!important;color:white!important; }
        .lang-btn.active { background:#6366f1!important;border-color:#6366f1!important;color:white!important; }
    </style>
</head>
<body>
<div th:replace="fragments/user-sidebar :: sidebar"></div>

<div class="main-content">
    <div class="page-header">
        <h1><i class="bi bi-pc-display me-2 text-primary"></i>Thiết Bị & Tài Sản</h1>
        <div style="color:#64748b;font-size:0.85rem;margin-top:4px;">Các thiết bị và tài sản công ty cấp cho bạn</div>
    </div>

    <!-- Stats -->
    <div class="stat-bar" th:if="${myAssets != null and !#lists.isEmpty(myAssets)}">
        <div class="stat-item">
            <div class="stat-num" style="color:#6366f1;" th:text="${myAssets.size()}">0</div>
            <div class="stat-lbl">Tổng tài sản</div>
        </div>
        <div class="stat-item">
            <div class="stat-num" style="color:#10b981;" th:text="${#lists.size(myAssets.?[actualReturn == null])}">0</div>
            <div class="stat-lbl">Đang sử dụng</div>
        </div>
        <div class="stat-item">
            <div class="stat-num" style="color:#94a3b8;" th:text="${#lists.size(myAssets.?[actualReturn != null])}">0</div>
            <div class="stat-lbl">Đã trả</div>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(myAssets)}" class="empty-state">
        <i class="bi bi-pc-display" style="font-size:3.5rem;display:block;margin-bottom:14px;color:#cbd5e1;"></i>
        <div style="font-weight:700;font-size:1rem;color:#64748b;margin-bottom:6px;">Chưa có tài sản nào</div>
        <div style="font-size:0.85rem;">Bạn hiện không giữ thiết bị hay tài sản nào của công ty.</div>
    </div>

    <!-- Asset Grid -->
    <div class="asset-grid" th:unless="${#lists.isEmpty(myAssets)}">
        <div class="asset-card" th:each="assignment : ${myAssets}">
            <div class="asset-card-header">
                <span class="asset-code" th:text="${assignment.asset.assetCode}">AST-001</span>
                <span th:class="'asset-status ' + (${assignment.actualReturn == null} ? 'status-active' : 'status-returned')"
                      th:text="${assignment.actualReturn == null ? '🟢 Đang sử dụng' : '⚫ Đã trả'}"></span>
            </div>
            <div class="asset-card-body">
                <div class="asset-name" th:text="${assignment.asset.assetName}">MacBook Pro</div>
                <div class="asset-category" th:text="${assignment.asset.category}">LAPTOP</div>
                <div class="asset-info">
                    <div class="asset-info-row">
                        <i class="bi bi-calendar-check"></i>
                        <span>Ngày nhận: <strong th:text="${#temporals.format(assignment.assignedDate, 'dd/MM/yyyy')}"></strong></span>
                    </div>
                    <div class="asset-info-row">
                        <i class="bi bi-shield-check"></i>
                        <span>Tình trạng: <strong th:text="${assignment.conditionOnAssign}">Mới</strong></span>
                    </div>
                    <div class="asset-info-row" th:if="${assignment.actualReturn != null}" style="color:#ef4444;">
                        <i class="bi bi-calendar-x"></i>
                        <span>Đã trả ngày: <strong th:text="${#temporals.format(assignment.actualReturn, 'dd/MM/yyyy')}"></strong></span>
                    </div>
                </div>
            </div>
            <div class="asset-card-footer">
                <i class="bi bi-person-fill"></i>
                Bàn giao bởi: <strong th:text="${assignment.assignedBy != null ? assignment.assignedBy.fullName : 'Hệ thống'}"></strong>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments/user-sidebar :: settingsFab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/lang-toggle.js}"></script>
<script th:src="@{/js/hrms-settings.js}"></script>
<script th:src="@{/js/hrms-notifications.js}"></script>
<script th:src="@{/js/hrms-ui.js}"></script>
<script th:src="@{/js/hrms-datatable.js}"></script>
</body>
</html>
