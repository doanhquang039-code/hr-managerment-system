<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Làm Thêm Giờ - HRMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; margin: 0; }
        .sidebar { width: 260px; min-height: 100vh; background: linear-gradient(180deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); position: fixed; left: 0; top: 0; z-index: 100; box-shadow: 4px 0 20px rgba(0,0,0,0.3); }
        .sidebar-brand { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .brand-name { color: white; font-weight: 700; font-size: 1rem; }
        .brand-sub { color: #64748b; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; }
        .sidebar-section-label { color: #475569; font-size: 0.65rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; padding: 12px 20px 4px; }
        .sidebar nav a { display: flex; align-items: center; gap: 12px; padding: 10px 20px; color: #94a3b8; text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar nav a:hover, .sidebar nav a.active { color: white; background: rgba(99,102,241,0.15); border-left-color: #6366f1; }
        .sidebar nav a i { font-size: 1rem; width: 20px; }
        .sidebar-logout { padding: 20px; border-top: 1px solid rgba(255,255,255,0.08); }
        .user-card { padding: 16px 20px; display: flex; align-items: center; gap: 12px; background: rgba(99,102,241,0.1); margin: 16px 12px; border-radius: 12px; }
        .user-av { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; }
        .main-content { margin-left: 260px; padding: 28px 32px; }
        .page-header { margin-bottom: 26px; }
        .page-header h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin: 0; }
        .form-card { background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .form-card-header { background: linear-gradient(135deg, #f59e0b, #f97316); padding: 20px 24px; color: white; }
        .form-card-header h5 { font-weight: 700; margin: 0; font-size: 1rem; }
        .form-card-body { padding: 22px 24px; }
        .form-label { font-weight: 600; color: #374151; font-size: 0.85rem; margin-bottom: 6px; }
        .form-control, .form-select { border-radius: 10px; border: 1.5px solid #e5e7eb; padding: 10px 14px; font-size: 0.9rem; }
        .form-control:focus, .form-select:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.1); }
        .btn-submit { background: linear-gradient(135deg, #f59e0b, #f97316); border: none; color: white; padding: 11px 24px; border-radius: 12px; font-weight: 600; width: 100%; }
        .history-card { background: white; border-radius: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); overflow: hidden; }
        .hc-head { padding: 18px 22px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
        .hc-head h6 { font-weight: 700; color: #0f172a; margin: 0; }
        .data-table th { background: #f8fafc; color: #64748b; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border: none; padding: 11px 16px; }
        .data-table td { padding: 12px 16px; font-size: 0.85rem; border-color: #f1f5f9; vertical-align: middle; }
        .data-table tr:hover td { background: #fafcff; }
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
        .badge-p { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
        .badge-a { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .badge-r { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .multiplier-tag { background: #ede9fe; color: #6366f1; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }

      /* ===== LANGUAGE TOGGLE ===== */
      .lang-btn { background:rgba(255,255,255,0.08)!important;border:1px solid rgba(255,255,255,0.15)!important;color:#94a3b8!important;border-radius:8px!important;padding:4px 10px!important;font-size:0.75rem!important;font-weight:600!important;cursor:pointer!important;transition:all 0.2s!important; }
      .lang-btn:hover { background:rgba(255,255,255,0.18)!important;color:white!important; }
      .lang-btn.active { background:#6366f1!important;border-color:#6366f1!important;color:white!important; }
    </style>
</head>
<body>
<div th:replace="fragments/user-sidebar :: sidebar"></div>

<div class="main-content">
    <div class="page-header">
        <h1><i class="bi bi-clock-history me-2 text-warning"></i>Đăng Ký Làm Thêm Giờ</h1>
        <div style="color:#64748b;font-size:0.85rem;margin-top:4px;">Nộp đơn OT và theo dõi trạng thái</div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- Form nộp đơn OT -->
        <div class="col-lg-4">
            <div class="form-card">
                <div class="form-card-header">
                    <h5><i class="bi bi-send me-2"></i>Nộp Đơn OT</h5>
                </div>
                <div class="form-card-body">
                    <form th:action="@{/user1/overtime}" method="post" id="otForm">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="userId" th:value="${currentUser != null ? currentUser.id : ''}"/>
                        <div class="mb-3">
                            <label class="form-label">Ngày làm thêm <span class="text-danger">*</span></label>
                            <input type="date" name="overtimeDate" class="form-control" required
                                   th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"/>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Giờ bắt đầu <span class="text-danger">*</span></label>
                                <input type="time" name="startTime" class="form-control" required/>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Giờ kết thúc <span class="text-danger">*</span></label>
                                <input type="time" name="endTime" class="form-control" required/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Lý do <span class="text-danger">*</span></label>
                            <textarea name="reason" class="form-control" rows="3" required
                                      placeholder="Mô tả công việc cần làm thêm..."></textarea>
                        </div>
                        <div style="background:#fff7ed;border-radius:10px;padding:12px;margin-bottom:14px;font-size:0.82rem;color:#92400e;">
                            <b>⚠️ Lưu ý:</b> Tối đa 4 giờ/ngày và 40 giờ/tháng. Hệ số OT: ngày thường x1.5, cuối tuần x2.0, ngày lễ x3.0.
                        </div>
                        <button type="submit" class="btn-submit btn">
                            <i class="bi bi-send me-2"></i>Gửi đơn OT
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Lịch sử -->
        <div class="col-lg-8">
            <div class="history-card">
                <div class="hc-head">
                    <h6><i class="bi bi-list-ul me-2"></i>Lịch Sử Đơn OT</h6>
                    <span style="font-size:0.8rem;color:#94a3b8;" th:text="${myRequests.size()} + ' đơn'"></span>
                </div>
                <div th:if="${#lists.isEmpty(myRequests)}" style="text-align:center;padding:50px;color:#94a3b8;">
                    <i class="bi bi-inbox" style="font-size:3rem;display:block;margin-bottom:12px;"></i>
                    Chưa có đơn OT nào. Hãy nộp đơn đầu tiên!
                </div>
                <div class="table-responsive" th:if="${!#lists.isEmpty(myRequests)}">
                    <table class="table data-table mb-0 hrms-dt" data-page-size="15">
                        <thead>
                            <tr>
                                <th>Ngày OT</th>
                                <th>Giờ</th>
                                <th>Tổng giờ</th>
                                <th>Hệ số</th>
                                <th>Lý do</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${myRequests}">
                                <td style="font-weight:600;" th:text="${r.overtimeDate}"></td>
                                <td style="font-size:0.82rem;" th:text="${r.startTime + ' - ' + r.endTime}"></td>
                                <td style="font-weight:700;color:#6366f1;" th:text="${r.totalHours} + 'h'"></td>
                                <td><span class="multiplier-tag" th:text="'x' + ${r.multiplier}"></span></td>
                                <td style="max-width:180px;font-size:0.82rem;color:#475569;"
                                    th:text="${r.reason != null ? #strings.abbreviate(r.reason, 50) : ''}"></td>
                                <td>
                                    <span class="status-badge"
                                          th:classappend="${r.status == 'PENDING' ? ' badge-p' : (r.status == 'APPROVED' ? ' badge-a' : ' badge-r')}"
                                          th:text="${r.status == 'PENDING' ? '⏳ Chờ duyệt' : (r.status == 'APPROVED' ? '✅ Đã duyệt' : '❌ Từ chối')}">
                                    </span>
                                    <div th:if="${r.rejectionReason != null}"
                                         style="font-size:0.72rem;color:#ef4444;margin-top:3px;"
                                         th:text="${r.rejectionReason}"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments/user-sidebar :: settingsFab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/lang-toggle.js}"></script>
<script th:src="@{/js/hrms-settings.js}"></script>
<script th:src="@{/js/hrms-notifications.js}"></script>
<script th:src="@{/js/hrms-ui.js}"></script>
<script th:src="@{/js/hrms-datatable.js}"></script>
</body>
</html>
