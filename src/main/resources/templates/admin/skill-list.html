<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Kỹ năng - HRMS Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#eef3f9; color:#0f172a; }
    .page-head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:24px; }
    .breadcrumb-lite { color:#64748b; font-size:.9rem; margin-bottom:6px; }
    .page-title { display:flex; align-items:center; gap:10px; font-size:1.75rem; font-weight:800; margin:0; }
    .page-subtitle { margin-top:6px; color:#64748b; font-size:.95rem; }
    .filter-card, .table-card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; box-shadow:0 12px 28px rgba(15,23,42,.06); }
    .filter-card { padding:18px 24px; margin-bottom:22px; }
    .filter-card label { color:#475569; font-size:.82rem; font-weight:800; }
    .table-card { overflow:hidden; }
    .table-head { padding:18px 24px; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; justify-content:space-between; }
    .table-head h2 { font-size:1.05rem; font-weight:800; margin:0; }
    .table th { background:#f8fafc; color:#64748b; font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; padding:13px 16px; border:0; white-space:nowrap; }
    .table td { padding:14px 16px; vertical-align:middle; border-color:#edf2f7; font-size:.9rem; }
    .emp-cell { display:flex; align-items:center; gap:12px; }
    .emp-av { width:36px; height:36px; border-radius:999px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; font-weight:800; flex:0 0 auto; }
    .tag { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-weight:800; font-size:.76rem; background:#ede9fe; color:#6d28d9; }
    .level { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-weight:800; font-size:.75rem; background:#f1f5f9; color:#475569; }
    .level-INTERMEDIATE { background:#dbeafe; color:#1d4ed8; }
    .level-ADVANCED { background:#d1fae5; color:#047857; }
    .level-EXPERT { background:#fef3c7; color:#92400e; }
    .action-btn { width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; text-decoration:none; font-weight:800; border:1px solid transparent; }
    .empty-state { padding:48px 16px; text-align:center; color:#94a3b8; }
    .btn-warning { font-weight:800; }
  </style>
</head>
<body>
<div th:replace="fragments/admin-sidebar :: sidebar"></div>
<main class="admin-main">
  <div class="page-head">
    <div>
      <div class="breadcrumb-lite"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Dashboard</a> / Kỹ năng</div>
      <h1 class="page-title"><i class="bi bi-mortarboard text-warning"></i>Quản lý Kỹ năng</h1>
      <div class="page-subtitle">Theo dõi kỹ năng, chứng chỉ và kinh nghiệm của nhân viên.</div>
    </div>
    <a th:href="@{/admin/skills/add}" class="btn btn-warning text-dark px-4 py-2"><i class="bi bi-plus-lg me-1"></i>Thêm kỹ năng</a>
  </div>

  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <section class="filter-card">
    <form th:action="@{/admin/skills}" method="get">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Nhân viên</label>
          <select name="userId" class="form-select">
            <option value="">-- Tất cả --</option>
            <option th:each="u : ${userOptions}" th:value="${u.id}" th:text="${u.fullName}" th:selected="${u.id == selectedUserId}"></option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Danh mục</label>
          <select name="category" class="form-select">
            <option value="">-- Tất cả --</option>
            <option value="TECHNICAL" th:selected="${selectedCategory == 'TECHNICAL'}">Technical</option>
            <option value="SOFT" th:selected="${selectedCategory == 'SOFT'}">Soft Skills</option>
            <option value="LANGUAGE" th:selected="${selectedCategory == 'LANGUAGE'}">Ngôn ngữ</option>
            <option value="MANAGEMENT" th:selected="${selectedCategory == 'MANAGEMENT'}">Quản lý</option>
          </select>
        </div>
        <div class="col-md-2"><button type="submit" class="btn btn-warning text-dark w-100"><i class="bi bi-search me-1"></i>Lọc</button></div>
        <div class="col-md-2"><a th:href="@{/admin/skills}" class="btn btn-outline-secondary w-100">Reset</a></div>
      </div>
    </form>
  </section>

  <section class="table-card">
    <div class="table-head">
      <h2><i class="bi bi-list-ul me-2"></i>Danh Sách Kỹ Năng</h2>
      <span class="text-muted small" th:text="${#lists.size(skills)} + ' kỹ năng'">0 kỹ năng</span>
    </div>
    <div class="table-responsive">
      <table class="table mb-0 hrms-dt" data-page-size="15">
        <thead>
        <tr>
          <th>Nhân viên</th><th>Kỹ năng</th><th>Danh mục</th><th>Cấp độ</th><th>Kinh nghiệm</th><th>Chứng chỉ</th><th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(skills)}"><td colspan="7" class="empty-state"><i class="bi bi-inbox fs-1 d-block mb-2"></i>Không có kỹ năng nào</td></tr>
        <tr th:each="s : ${skills}">
          <td><div class="emp-cell"><span class="emp-av" th:text="${#strings.isEmpty(s.userFullName) ? 'N' : #strings.substring(s.userFullName,0,1)}">N</span><strong th:text="${s.userFullName}">Nhân viên</strong></div></td>
          <td class="fw-semibold" th:text="${s.skillName}">Kỹ năng</td>
          <td><span class="tag" th:text="${s.skillCategory}">TECHNICAL</span></td>
          <td><span class="level" th:classappend="${s.skillLevel != null ? ' level-' + s.skillLevel.name() : ''}" th:text="${s.skillLevel != null ? s.skillLevel.name() : 'N/A'}">BEGINNER</span></td>
          <td th:text="${s.yearsExp != null ? s.yearsExp + ' năm' : '-'}">0 năm</td>
          <td>
            <span th:if="${s.isCertified}" class="text-success fw-semibold"><i class="bi bi-patch-check-fill me-1"></i><span th:text="${s.certificateName != null ? s.certificateName : 'Có chứng chỉ'}">Có chứng chỉ</span></span>
            <span th:unless="${s.isCertified}" class="text-muted">Chưa có</span>
          </td>
          <td>
            <a th:href="@{/admin/skills/edit/{id}(id=${s.id})}" class="action-btn" style="background:#ede9fe;color:#6d28d9;border-color:#ddd6fe" title="Sửa"><i class="bi bi-pencil-square"></i></a>
            <a th:href="@{/admin/skills/delete/{id}(id=${s.id})}" onclick="return confirm('Xóa kỹ năng này?')" class="action-btn" style="background:#fee2e2;color:#dc2626;border-color:#fecaca" title="Xóa"><i class="bi bi-trash"></i></a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/hrms-datatable.js}"></script>
<script th:src="@{/js/hrms-ui.js}"></script>
</body>
</html>
