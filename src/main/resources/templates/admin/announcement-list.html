<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Th&#244;ng b&#225;o c&#244;ng ty - Admin HRMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; margin: 0; color: #0f172a; }
        .sidebar { width: 240px; min-height: 100vh; position: fixed; left: 0; top: 0; background: linear-gradient(180deg, #0f172a, #1e293b); padding-top: 16px; }
        .sidebar a { color: #94a3b8; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-size: 0.86rem; border-left: 3px solid transparent; }
        .sidebar a:hover, .sidebar a.active { color: white; background: rgba(255,255,255,.08); border-left-color: #f59e0b; }
        .nav-parent { justify-content: space-between; cursor: pointer; }
        .nav-parent .left { display: inline-flex; align-items: center; gap: 10px; }
        .nav-parent .bi-caret-down-fill { margin-left: auto; color: #cbd5e1; font-size: .68rem; }
        .submenu { display: none; padding: 2px 0 8px; background: rgba(255,255,255,.03); }
        .submenu.open { display: block; }
        .submenu a { padding: 9px 18px 9px 48px; font-size: .84rem; color: #cbd5e1; }
        .submenu a.active { color: white; background: rgba(245,158,11,.18); border-left-color: #f59e0b; }
        .main { margin-left: 240px; padding: 36px 40px; }
        .table-card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(15,23,42,.08); overflow: hidden; }
        .lang-btn { background:rgba(255,255,255,0.08)!important;border:1px solid rgba(255,255,255,0.15)!important;color:#94a3b8!important;border-radius:8px!important;padding:4px 10px!important;font-size:0.75rem!important;font-weight:600!important; }
        .lang-btn.active { background:#6366f1!important;border-color:#6366f1!important;color:white!important; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="text-white text-center fw-bold py-3 small"><i class="bi bi-shield-check"></i> HRMS ADMIN</div>
    <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a th:href="@{/admin/announcements}" class="active"><i class="bi bi-megaphone"></i> Th&#244;ng b&#225;o c&#244;ng ty</a>
    <a th:href="@{/admin/users}"><i class="bi bi-people"></i> Nh&#226;n vi&#234;n</a>
    <a th:href="@{/admin/groups}"><i class="bi bi-diagram-3"></i> Groups</a>
    <a class="nav-parent" data-submenu-toggle="department-options">
        <span class="left"><i class="bi bi-building"></i> Ph&#242;ng ban</span>
        <i class="bi bi-caret-down-fill"></i>
    </a>
    <div id="department-options" class="submenu">
        <a th:href="@{/admin/departments}">T&#7845;t c&#7843; ph&#242;ng ban</a>
        <a th:each="d : ${departments}" th:href="@{/admin/departments/{id}/members(id=${d.id})}" th:text="${d.departmentName}">Ph&#242;ng ban</a>
    </div>
    <div style="padding:8px 16px;border-top:1px solid rgba(255,255,255,0.08);margin-top:4px;">
        <div style="display:flex;align-items:center;gap:6px;justify-content:center;">
            <button class="lang-btn" data-lang="vi">&#127475;&#127483; VI</button><span style="color:rgba(255,255,255,0.2);font-size:0.7rem;">|</span><button class="lang-btn" data-lang="en">&#127468;&#127463; EN</button>
        </div>
    </div>
    <form th:action="@{/logout}" method="post" class="px-3 mt-4"><button type="submit" class="btn btn-outline-light btn-sm w-100"><i class="bi bi-box-arrow-right"></i> &#272;&#259;ng xu&#7845;t</button></form>
</div>
<div class="main">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div class="text-primary small mb-1">Dashboard / Announcements</div>
            <h1 class="h4 fw-bold m-0">Th&#244;ng b&#225;o n&#7897;i b&#7897;</h1>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/announcements/create}"><i class="bi bi-plus-lg"></i> T&#7841;o m&#7899;i</a>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="table-card">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th>Ti&#234;u &#273;&#7873;</th>
                <th>Ph&#7841;m vi</th>
                <th>&#431;u ti&#234;n</th>
                <th>&#272;&#259;ng</th>
                <th>Hi&#7875;n th&#7883;</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${announcements}">
                <td th:text="${a.title}">-</td>
                <td th:text="${a.targetDepartment != null} ? ${a.targetDepartment.departmentName} : 'Toan cong ty'">-</td>
                <td><span class="badge bg-secondary" th:text="${a.priority}">NORMAL</span></td>
                <td class="small text-muted" th:text="${#temporals.format(a.publishedAt, 'dd/MM/yyyy HH:mm')}">-</td>
                <td><span th:class="${a.active} ? 'badge bg-success' : 'badge bg-secondary'" th:text="${a.active} ? 'Bat' : 'Tat'">-</span></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/announcements/{id}/edit(id=${a.id})}">S&#7917;a</a>
                    <form th:action="@{/admin/announcements/{id}/delete(id=${a.id})}" method="post" class="d-inline" onsubmit="return confirm('Xoa thong bao nay?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger">X&#243;a</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(announcements)}"><td colspan="6" class="text-center text-muted py-4">Ch&#432;a c&#243; d&#7919; li&#7879;u.</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script th:src="@{/js/lang-toggle.js}"></script>
<script th:src="@{/js/hrms-settings.js}"></script>
<script th:src="@{/js/hrms-search.js}"></script>
<script th:src="@{/js/hrms-notifications.js}"></script>
<script th:src="@{/js/hrms-ui.js}"></script>
<script th:src="@{/js/hrms-datatable.js}"></script>
<script>
    document.querySelectorAll('[data-submenu-toggle]').forEach((toggle) => {
        toggle.addEventListener('click', () => {
            const menu = document.getElementById(toggle.dataset.submenuToggle);
            if (menu) menu.classList.toggle('open');
        });
    });
</script>
</body>
</html>
