<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Thông báo công ty - Admin HRMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>*{font-family:Inter,system-ui,sans-serif}body{margin:0;background:#eef3f9;color:#0f172a}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.page-title{font-size:1.75rem;font-weight:800;margin:0}.page-sub{color:#64748b;margin-top:6px}.table-card{background:white;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 12px 28px rgba(15,23,42,.06);overflow:hidden}th{background:#f8fafc!important;color:#475569;font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;padding:14px 16px!important}td{padding:14px 16px!important;vertical-align:middle}.empty-state{text-align:center;color:#64748b;padding:42px}</style>
</head>
<body>
<div th:replace="fragments/admin-sidebar :: sidebar"></div>
<main class="admin-main">
  <div class="page-head"><div><div class="text-muted small"><a th:href="@{/admin/dashboard}" class="text-decoration-none">Dashboard</a> / Thông báo</div><h1 class="page-title"><i class="bi bi-megaphone text-primary me-2"></i>Thông báo nội bộ</h1><div class="page-sub">Quản lý thông báo công ty theo phòng ban, mức ưu tiên và trạng thái hiển thị.</div></div><a class="btn btn-primary fw-bold" th:href="@{/admin/announcements/create}"><i class="bi bi-plus-lg me-1"></i>Tạo mới</a></div>
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <section class="table-card"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Tiêu đề</th><th>Phạm vi</th><th>Ưu tiên</th><th>Đăng</th><th>Hiển thị</th><th></th></tr></thead><tbody><tr th:each="a : ${announcements}"><td class="fw-semibold" th:text="${a.title}">Tiêu đề</td><td th:text="${a.targetDepartment != null ? a.targetDepartment.departmentName : 'Toàn công ty'}">Toàn công ty</td><td><span class="badge bg-secondary" th:text="${a.priority}">NORMAL</span></td><td class="small text-muted" th:text="${a.publishedAt != null ? #temporals.format(a.publishedAt, 'dd/MM/yyyy HH:mm') : '-'}">-</td><td><span th:class="${a.active} ? 'badge bg-success' : 'badge bg-secondary'" th:text="${a.active} ? 'Bật' : 'Tắt'">Bật</span></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/announcements/{id}/edit(id=${a.id})}">Sửa</a><form th:action="@{/admin/announcements/{id}/delete(id=${a.id})}" method="post" class="d-inline" onsubmit="return confirm('Xóa thông báo này?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button></form></td></tr><tr th:if="${#lists.isEmpty(announcements)}"><td colspan="6" class="empty-state"><i class="bi bi-inbox fs-1 d-block mb-2"></i>Chưa có dữ liệu.</td></tr></tbody></table></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/hrms-ui.js}"></script>
</body></html>
