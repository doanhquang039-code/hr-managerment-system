<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khóa học - HRMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: Inter, sans-serif; }
        body { margin: 0; background: #eef3f9; color: #0f172a; }
        .course-shell { max-width: 980px; margin: 0 auto; }
        .page-title { font-size: 1.65rem; font-weight: 800; margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }
        .course-card { background: #fff; border-radius: 16px; border: 1px solid #e5e7eb; box-shadow: 0 12px 32px rgba(15,23,42,.08); overflow: hidden; }
        .course-card-head { padding: 22px 28px; background: linear-gradient(135deg, #2563eb, #0ea5e9); color: #fff; }
        .course-card-head h2 { margin: 0; font-size: 1.2rem; font-weight: 800; }
        .course-card-body { padding: 28px; }
        .form-label { font-weight: 800; color: #334155; }
    </style>
</head>
<body>
<div th:replace="fragments/admin-sidebar :: sidebar"></div>
<main class="admin-main">
    <div class="course-shell">
        <h1 class="page-title"><i class="bi bi-book text-primary"></i>Tạo khóa học mới</h1>

        <section class="course-card">
            <div class="course-card-head">
                <h2><i class="bi bi-plus-circle me-2"></i>Thông tin khóa học</h2>
            </div>
            <div class="course-card-body">
                <form th:action="@{/admin/course/save}" method="post" th:object="${course}">
                    <input type="hidden" th:field="*{id}">
                    <div class="mb-3">
                        <label class="form-label">Tiêu đề khóa học *</label>
                        <input type="text" class="form-control" th:field="*{title}" required placeholder="VD: Onboarding nhân viên mới">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" rows="4" th:field="*{description}" placeholder="Tóm tắt nội dung khóa học"></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Danh mục *</label>
                            <select class="form-select" th:field="*{category}" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option value="TECHNICAL">Kỹ thuật</option>
                                <option value="SOFT_SKILLS">Kỹ năng mềm</option>
                                <option value="COMPLIANCE">Tuân thủ</option>
                                <option value="LEADERSHIP">Lãnh đạo</option>
                                <option value="SALES">Bán hàng</option>
                                <option value="MANAGEMENT">Quản lý</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Cấp độ *</label>
                            <select class="form-select" th:field="*{level}" required>
                                <option value="">-- Chọn cấp độ --</option>
                                <option value="BEGINNER">Cơ bản</option>
                                <option value="INTERMEDIATE">Trung cấp</option>
                                <option value="ADVANCED">Nâng cao</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Thời lượng (phút)</label>
                            <input type="number" class="form-control" th:field="*{durationMinutes}" min="0" placeholder="60">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Điểm đạt (%)</label>
                            <input type="number" class="form-control" th:field="*{passingScore}" min="0" max="100" placeholder="70">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">URL hình ảnh</label>
                        <input type="url" class="form-control" th:field="*{thumbnailUrl}" placeholder="https://example.com/image.jpg">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mục tiêu học tập</label>
                        <textarea class="form-control" rows="3" th:field="*{learningObjectives}" placeholder="Các mục tiêu chính của khóa học"></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Điều kiện tiên quyết</label>
                        <textarea class="form-control" rows="3" th:field="*{prerequisites}" placeholder="Những điều nhân viên cần biết trước khi học"></textarea>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="isActive">
                                <label class="form-check-label fw-bold" for="isActive">Kích hoạt khóa học</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{isMandatory}" id="isMandatory">
                                <label class="form-check-label fw-bold" for="isMandatory">Khóa học bắt buộc</label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/courses}" class="btn btn-outline-secondary fw-bold"><i class="bi bi-arrow-left me-1"></i>Quay lại</a>
                        <button type="submit" class="btn btn-primary fw-bold px-4"><i class="bi bi-check-lg me-1"></i>Lưu khóa học</button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/hrms-ui.js}"></script>
</body>
</html>
