<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Th&#234;m kh&#243;a h&#7885;c - HRMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: Inter, sans-serif; }
        body { margin:0; background:#eef3f9; color:#0f172a; }
        .admin-main { padding:30px 38px 96px; }
        .course-form-shell { max-width:1100px; margin:0 auto; }
        .form-hero {
            background:linear-gradient(135deg,#111827,#2563eb 58%,#0f766e);
            border-radius:18px; padding:28px 32px; margin-bottom:22px; color:#fff;
            display:flex; justify-content:space-between; gap:18px; align-items:center;
            box-shadow:0 22px 52px rgba(15,23,42,.18);
        }
        .form-hero h1 { margin:0; font-size:2rem; font-weight:800; letter-spacing:0; }
        .form-hero p { margin:8px 0 0; color:rgba(255,255,255,.78); }
        .course-card { background:#fff; border:1px solid #e5e7eb; border-radius:18px; box-shadow:0 14px 34px rgba(15,23,42,.08); overflow:hidden; }
        .course-card-head { padding:18px 24px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; gap:10px; font-weight:800; }
        .course-card-body { padding:24px; }
        .form-label { font-weight:800; color:#334155; }
        .form-control, .form-select { min-height:46px; border-radius:12px; border-color:#dbe3ef; }
        textarea.form-control { min-height:auto; }
        .upload-box {
            border:1px dashed #93c5fd; background:#eff6ff; border-radius:16px; padding:18px;
        }
        .upload-box .hint { color:#475569; font-size:.88rem; }
        .switch-row { background:#f8fafc; border:1px solid #e5e7eb; border-radius:14px; padding:14px 16px; }
        @media (max-width:720px) {
            .admin-main { padding:20px 16px 90px; }
            .form-hero { flex-direction:column; align-items:flex-start; }
        }
    </style>
</head>
<body>
<div th:replace="fragments/admin-sidebar :: sidebar"></div>
<main class="admin-main">
    <div class="course-form-shell">
        <section class="form-hero">
            <div>
                <h1><i class="bi bi-book me-2"></i>Th&#234;m kh&#243;a h&#7885;c m&#7899;i</h1>
                <p>T&#7841;o kh&#243;a h&#7885;c LMS, upload video l&#234;n Cloudinary v&#224; qu&#7843;n l&#253; n&#7897;i dung &#273;&#224;o t&#7841;o.</p>
            </div>
            <a th:href="@{/admin/courses}" class="btn btn-light fw-bold"><i class="bi bi-arrow-left me-1"></i>Quay l&#7841;i</a>
        </section>

        <section class="course-card">
            <div class="course-card-head">
                <i class="bi bi-plus-circle text-primary"></i>
                <span>Th&#244;ng tin kh&#243;a h&#7885;c</span>
            </div>
            <div class="course-card-body">
                <form th:action="@{/admin/course/save}" method="post" th:object="${course}" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" th:field="*{id}">

                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Ti&#234;u &#273;&#7873; kh&#243;a h&#7885;c *</label>
                            <input type="text" class="form-control" th:field="*{title}" required placeholder="VD: Onboarding nh&#226;n vi&#234;n m&#7899;i">
                        </div>

                        <div class="col-12">
                            <label class="form-label">M&#244; t&#7843;</label>
                            <textarea class="form-control" rows="4" th:field="*{description}" placeholder="T&#243;m t&#7855;t n&#7897;i dung kh&#243;a h&#7885;c"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Danh m&#7909;c *</label>
                            <select class="form-select" th:field="*{category}" required>
                                <option value="">-- Ch&#7885;n danh m&#7909;c --</option>
                                <option value="TECHNICAL">K&#7929; thu&#7853;t</option>
                                <option value="SOFT_SKILLS">K&#7929; n&#259;ng m&#7873;m</option>
                                <option value="COMPLIANCE">Tu&#226;n th&#7911;</option>
                                <option value="LEADERSHIP">L&#227;nh &#273;&#7841;o</option>
                                <option value="SALES">B&#225;n h&#224;ng</option>
                                <option value="MANAGEMENT">Qu&#7843;n l&#253;</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">C&#7845;p &#273;&#7897; *</label>
                            <select class="form-select" th:field="*{level}" required>
                                <option value="">-- Ch&#7885;n c&#7845;p &#273;&#7897; --</option>
                                <option value="BEGINNER">C&#417; b&#7843;n</option>
                                <option value="INTERMEDIATE">Trung c&#7845;p</option>
                                <option value="ADVANCED">N&#226;ng cao</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Th&#7901;i l&#432;&#7907;ng (ph&#250;t)</label>
                            <input type="number" class="form-control" th:field="*{durationMinutes}" min="0" placeholder="60">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">&#272;i&#7875;m &#273;&#7841;t (%)</label>
                            <input type="number" class="form-control" th:field="*{passingScore}" min="0" max="100" placeholder="70">
                        </div>

                        <div class="col-12">
                            <div class="upload-box">
                                <label class="form-label d-flex align-items-center gap-2">
                                    <i class="bi bi-cloud-arrow-up text-primary"></i>
                                    Video kh&#243;a h&#7885;c
                                </label>
                                <input type="file" class="form-control" name="videoFile" accept="video/*">
                                <div class="hint mt-2">Ch&#7885;n video t&#7915; m&#225;y. File s&#7869; upload l&#234;n Cloudinary trong th&#432; m&#7909;c <code>hr_course_videos</code>.</div>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">URL h&#236;nh &#7843;nh thumbnail</label>
                            <input type="url" class="form-control" th:field="*{thumbnailUrl}" placeholder="B&#7887; tr&#7889;ng n&#7871;u mu&#7889;n t&#7921; l&#7845;y thumbnail t&#7915; video">
                        </div>

                        <div class="col-12">
                            <label class="form-label">M&#7909;c ti&#234;u h&#7885;c t&#7853;p</label>
                            <textarea class="form-control" rows="3" th:field="*{learningObjectives}" placeholder="C&#225;c m&#7909;c ti&#234;u ch&#237;nh c&#7911;a kh&#243;a h&#7885;c"></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label">&#272;i&#7873;u ki&#7879;n ti&#234;n quy&#7871;t</label>
                            <textarea class="form-control" rows="3" th:field="*{prerequisites}" placeholder="Nh&#7919;ng &#273;i&#7873;u nh&#226;n vi&#234;n c&#7847;n bi&#7871;t tr&#432;&#7899;c khi h&#7885;c"></textarea>
                        </div>

                        <div class="col-md-6">
                            <div class="form-check form-switch switch-row">
                                <input class="form-check-input" type="checkbox" th:field="*{isActive}" id="isActive">
                                <label class="form-check-label fw-bold" for="isActive">K&#237;ch ho&#7841;t kh&#243;a h&#7885;c</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch switch-row">
                                <input class="form-check-input" type="checkbox" th:field="*{isMandatory}" id="isMandatory">
                                <label class="form-check-label fw-bold" for="isMandatory">Kh&#243;a h&#7885;c b&#7855;t bu&#7897;c</label>
                            </div>
                        </div>

                        <div class="col-12 d-flex justify-content-end gap-2 pt-2">
                            <a th:href="@{/admin/courses}" class="btn btn-outline-secondary fw-bold"><i class="bi bi-arrow-left me-1"></i>Quay l&#7841;i</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4"><i class="bi bi-check-lg me-1"></i>L&#432;u kh&#243;a h&#7885;c</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/hrms-ui.js}"></script>
</body>
</html>
