<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Qu&#7843;n l&#253; kh&#243;a h&#7885;c - HRMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: Inter, sans-serif; }
        body { margin:0; background:#eef3f9; color:#0f172a; }
        .admin-main { padding:28px 36px 92px; }
        .course-react-shell { max-width:1440px; margin:0 auto; }
        .course-react-hero {
            display:flex; align-items:center; justify-content:space-between; gap:20px;
            background:linear-gradient(135deg,#111827,#2563eb 58%,#0f766e);
            color:#fff; border-radius:18px; padding:28px 32px; margin-bottom:22px;
            box-shadow:0 22px 52px rgba(15,23,42,.18);
        }
        .course-react-kicker { display:inline-flex; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.13); font-size:.76rem; font-weight:800; letter-spacing:.08em; margin-bottom:10px; }
        .course-react-hero h1 { margin:0; font-size:2rem; font-weight:800; letter-spacing:0; }
        .course-react-hero p { margin:8px 0 0; color:rgba(255,255,255,.78); max-width:680px; }
        .course-react-new { display:inline-flex; align-items:center; gap:8px; background:#fff; color:#1d4ed8; border-radius:12px; padding:12px 16px; font-weight:800; text-decoration:none; white-space:nowrap; }
        .course-react-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:18px; }
        .course-react-stat { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:18px; display:flex; gap:14px; align-items:center; box-shadow:0 12px 28px rgba(15,23,42,.07); }
        .course-react-stat-icon { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:#eef2ff; color:#4f46e5; font-size:1.25rem; }
        .course-react-stat.green .course-react-stat-icon { background:#dcfce7; color:#059669; }
        .course-react-stat.red .course-react-stat-icon { background:#fee2e2; color:#dc2626; }
        .course-react-stat.purple .course-react-stat-icon { background:#f3e8ff; color:#7c3aed; }
        .course-react-stat-label { font-size:.75rem; color:#64748b; text-transform:uppercase; font-weight:800; letter-spacing:.04em; }
        .course-react-stat-value { font-size:1.75rem; font-weight:800; line-height:1.1; margin-top:3px; }
        .course-react-filters { display:grid; grid-template-columns:minmax(280px,1fr) 220px 220px; gap:12px; background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:14px; margin-bottom:18px; box-shadow:0 12px 28px rgba(15,23,42,.07); }
        .course-react-search { display:flex; align-items:center; gap:10px; border:1px solid #dbe3ef; border-radius:12px; padding:0 13px; background:#fff; }
        .course-react-search i { color:#64748b; }
        .course-react-search input, .course-react-filters select { width:100%; min-height:44px; border:0; outline:0; color:#0f172a; font-weight:650; background:#fff; }
        .course-react-filters select { border:1px solid #dbe3ef; border-radius:12px; padding:0 12px; }
        .course-react-list { display:grid; gap:14px; }
        .course-react-card { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:16px; box-shadow:0 12px 28px rgba(15,23,42,.07); display:grid; grid-template-columns:92px minmax(0,1fr) auto; gap:16px; align-items:center; }
        .course-react-thumb { width:92px; height:92px; border-radius:14px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#dbeafe,#eef2ff); color:#2563eb; font-size:2rem; }
        .course-react-thumb img { width:100%; height:100%; object-fit:cover; }
        .course-react-tags { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
        .course-react-tag { display:inline-flex; align-items:center; border-radius:999px; padding:5px 9px; background:#f1f5f9; color:#475569; font-size:.72rem; font-weight:800; }
        .course-react-tag.primary { background:#dbeafe; color:#1d4ed8; }
        .course-react-tag.success { background:#dcfce7; color:#047857; }
        .course-react-tag.danger { background:#fee2e2; color:#b91c1c; }
        .course-react-tag.muted { background:#e5e7eb; color:#475569; }
        .course-react-body h3 { margin:0 0 6px; font-size:1.08rem; font-weight:800; }
        .course-react-body p { margin:0 0 10px; color:#64748b; line-height:1.5; }
        .course-react-meta { display:flex; gap:12px; flex-wrap:wrap; color:#475569; font-size:.82rem; font-weight:700; }
        .course-react-meta span { display:inline-flex; align-items:center; gap:6px; }
        .course-react-actions { display:flex; gap:8px; align-items:center; }
        .course-react-empty { background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:56px 20px; text-align:center; color:#64748b; box-shadow:0 12px 28px rgba(15,23,42,.07); }
        .course-react-empty i { display:block; font-size:2.5rem; margin-bottom:12px; }
        .course-react-empty strong { display:block; color:#334155; margin-bottom:4px; }
        @media (max-width:1100px) {
            .course-react-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .course-react-filters { grid-template-columns:1fr; }
            .course-react-card { grid-template-columns:72px minmax(0,1fr); }
            .course-react-thumb { width:72px; height:72px; }
            .course-react-actions { grid-column:1 / -1; }
        }
        @media (max-width:720px) {
            .admin-main { padding:20px 16px 90px; }
            .course-react-hero { flex-direction:column; align-items:flex-start; }
            .course-react-stats { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
<div th:replace="fragments/admin-sidebar :: sidebar"></div>
<main class="admin-main">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div data-hrms-react="CourseAdminList"></div>
</main>

<script th:inline="javascript">
    window.HRMS_COURSE_REACT_CONFIG = {
        courses: /*[[${courseCards}]]*/ []
    };
</script>
<script th:src="@{/js/hrms-course-react.js}"></script>
<script th:src="@{/js/hrms-ui.js}"></script>
</body>
</html>
