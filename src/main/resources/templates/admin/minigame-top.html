<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top minigame - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<div th:replace="fragments/admin-sidebar :: sidebar"></div>
<main class="admin-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-trophy me-2"></i>Top minigame</h1>
            <div class="text-muted">Admin xem b&#7843;ng top theo role, bao g&#7891;m User v&#224; Hiring.</div>
        </div>
        <a href="/admin/minigame" class="btn btn-outline-primary"><i class="bi bi-controller"></i> Ch&#417;i th&#7917;</a>
    </div>

    <form class="card mb-4" method="get" action="/admin/minigame/top">
        <div class="card-body row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label">Minigame</label>
                <select class="form-select" name="quizId">
                    <option th:each="game : ${games}" th:value="${game.id}" th:selected="${game.id == quiz.id}" th:text="${game.title}">Game</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Role</label>
                <select class="form-select" name="role">
                    <option value="">T&#7845;t c&#7843;</option>
                    <option th:each="roleItem : ${roles}" th:value="${roleItem}" th:selected="${selectedRole == roleItem}" th:text="${roleItem}">USER</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary w-100" type="submit"><i class="bi bi-filter"></i> L&#7885;c top</button>
            </div>
        </div>
    </form>

    <div class="card">
        <div class="card-header bg-white fw-bold">
            <span th:text="${quiz.title}">Game</span>
            <span class="badge text-bg-secondary ms-2" th:text="${selectedRole ?: 'ALL'}">ALL</span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nh&#226;n vi&#234;n</th>
                    <th>Role</th>
                    <th>&#272;i&#7875;m</th>
                    <th>Th&#7901;i gian</th>
                    <th>Qu&#224;</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(leaderboard)}">
                    <td colspan="6" class="text-center text-muted py-4">Ch&#432;a c&#243; l&#432;&#7907;t ch&#417;i.</td>
                </tr>
                <tr th:each="attempt, stat : ${leaderboard}">
                    <td th:text="${stat.count}">1</td>
                    <td th:text="${attempt.user != null ? attempt.user.fullName : 'Nhan vien'}">Nhan vien</td>
                    <td><span class="badge text-bg-light" th:text="${attempt.user != null ? attempt.user.role : 'N/A'}">USER</span></td>
                    <td class="fw-bold text-success" th:text="${attempt.score + '/' + attempt.totalPoints}">50/50</td>
                    <td th:text="${#temporals.format(attempt.completedAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                    <td th:text="${stat.count == 1 ? quiz.rewardTop1 : (stat.count == 2 ? quiz.rewardTop2 : (stat.count == 3 ? quiz.rewardTop3 : ''))}">Voucher</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
