<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông tin tài sản - HRMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: Inter, sans-serif; }
        body { margin: 0; background: #eef3f9; color: #0f172a; }
        .form-shell { max-width: 980px; margin: 0 auto; }
        .page-title { font-size: 1.65rem; font-weight: 800; margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }
        .card-form { background: #fff; border-radius: 16px; border: 1px solid #e5e7eb; box-shadow: 0 12px 32px rgba(15,23,42,.08); overflow: hidden; }
        .card-form-header { padding: 22px 28px; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; }
        .card-form-header h2 { margin: 0; font-size: 1.2rem; font-weight: 800; }
        .card-form-body { padding: 28px; }
        .form-label { font-weight: 800; color: #334155; }
    </style>
</head>
<body>
<div th:replace="fragments/admin-sidebar :: sidebar"></div>
<main class="admin-main">
    <div class="form-shell">
        <h1 class="page-title">
            <i class="bi bi-box-seam text-primary"></i>
            <span th:text="${asset.id != null ? 'Chỉnh sửa tài sản' : 'Thêm tài sản mới'}">Thêm tài sản mới</span>
        </h1>

        <section class="card-form">
            <div class="card-form-header">
                <h2><i class="bi bi-pencil-square me-2"></i>Thông tin tài sản</h2>
            </div>
            <div class="card-form-body">
                <form th:action="@{/admin/assets/save}" th:object="${asset}" method="post">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{createdAt}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Mã tài sản *</label>
                            <input type="text" class="form-control" th:field="*{assetCode}" required placeholder="VD: LT-001">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tên tài sản *</label>
                            <input type="text" class="form-control" th:field="*{assetName}" required placeholder="VD: Laptop Dell XPS 15">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Danh mục *</label>
                            <select class="form-select" th:field="*{category}" required>
                                <option value="LAPTOP">Laptop / PC</option>
                                <option value="MONITOR">Màn hình</option>
                                <option value="PHONE">Điện thoại</option>
                                <option value="FURNITURE">Bàn ghế</option>
                                <option value="PRINTER">Máy in</option>
                                <option value="NETWORK">Thiết bị mạng</option>
                                <option value="OTHER">Khác</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Trạng thái</label>
                            <select class="form-select" th:field="*{status}">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Vị trí</label>
                            <input type="text" class="form-control" th:field="*{location}" placeholder="VD: Kho IT">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Serial</label>
                            <input type="text" class="form-control" th:field="*{serialNumber}" placeholder="Số serial">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Ngày mua</label>
                            <input type="date" class="form-control" th:field="*{purchaseDate}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hết bảo hành</label>
                            <input type="date" class="form-control" th:field="*{warrantyExpiry}">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Giá mua</label>
                            <input type="number" step="1000" class="form-control" th:field="*{purchasePrice}" placeholder="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Giá trị hiện tại</label>
                            <input type="number" step="1000" class="form-control" th:field="*{currentValue}" placeholder="0">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" rows="4" th:field="*{description}" placeholder="Cấu hình, tình trạng, ghi chú sử dụng..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/assets}" class="btn btn-outline-secondary fw-bold">
                            <i class="bi bi-arrow-left me-1"></i>Quay lại
                        </a>
                        <button type="submit" class="btn btn-primary fw-bold px-4">
                            <i class="bi bi-check-lg me-1"></i>Lưu tài sản
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>
<script th:src="@{/js/hrms-ui.js}"></script>
</body>
</html>
