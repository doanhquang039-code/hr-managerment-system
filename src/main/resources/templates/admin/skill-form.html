<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Form Kỹ năng - HRMS Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>*{font-family:Inter,system-ui,sans-serif}body{margin:0;background:#eef3f9;color:#0f172a}.form-card{background:white;border-radius:14px;box-shadow:0 12px 28px rgba(15,23,42,.06);overflow:hidden;max-width:920px;border:1px solid #e2e8f0}.form-card-header{background:linear-gradient(135deg,#6366f1,#8b5cf6);padding:24px 30px;color:white}.form-card-header h1{font-size:1.35rem;font-weight:800;margin:0}.form-card-body{padding:28px 30px}.form-label{font-weight:800;color:#374151;font-size:.85rem}.form-control,.form-select{border-radius:10px;min-height:44px}.btn-save{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:white;padding:11px 26px;border-radius:10px;font-weight:800}.section-note{color:#64748b;font-size:.9rem;margin-top:6px}</style>
</head>
<body>
<div th:replace="fragments/admin-sidebar :: sidebar"></div>
<main class="admin-main">
  <div class="mb-3"><a th:href="@{/admin/skills}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Quay lại</a></div>
  <div th:if="${error}" class="alert alert-danger"><span th:text="${error}"></span></div>
  <section class="form-card"><div class="form-card-header"><h1><i class="bi bi-mortarboard me-2"></i><span th:text="${skill.id != null ? 'Chỉnh sửa kỹ năng' : 'Thêm kỹ năng mới'}">Thêm kỹ năng mới</span></h1><div class="section-note text-white-50">Ghi nhận kỹ năng, danh mục, cấp độ và chứng chỉ của nhân viên.</div></div><div class="form-card-body"><form th:action="@{/admin/skills/save}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="id" th:value="${skill.id}">
    <div class="row g-3"><div class="col-md-6"><label class="form-label">Nhân viên <span class="text-danger">*</span></label><select name="userId" class="form-select" required><option value="">-- Chọn nhân viên --</option><option th:each="u : ${userOptions}" th:value="${u.id}" th:text="${u.fullName}" th:selected="${selectedUserId != null and selectedUserId == u.id}"></option></select></div><div class="col-md-6"><label class="form-label">Tên kỹ năng <span class="text-danger">*</span></label><input type="text" name="skillName" class="form-control" required th:value="${skill.skillName}" placeholder="VD: Java, Python, Communication..."></div>
    <div class="col-md-4"><label class="form-label">Danh mục</label><select name="skillCategory" class="form-select"><option value="TECHNICAL" th:selected="${skill.skillCategory == 'TECHNICAL'}">Technical</option><option value="SOFT" th:selected="${skill.skillCategory == 'SOFT'}">Soft Skills</option><option value="LANGUAGE" th:selected="${skill.skillCategory == 'LANGUAGE'}">Ngôn ngữ</option><option value="MANAGEMENT" th:selected="${skill.skillCategory == 'MANAGEMENT'}">Quản lý</option></select></div><div class="col-md-4"><label class="form-label">Cấp độ</label><select name="skillLevel" class="form-select"><option th:each="l : ${skillLevels}" th:value="${l.name()}" th:text="${l.name()}" th:selected="${skill.skillLevel == l}"></option></select></div><div class="col-md-4"><label class="form-label">Số năm kinh nghiệm</label><input type="number" name="yearsExp" class="form-control" step="0.5" min="0" th:value="${skill.yearsExp != null ? skill.yearsExp : 0}"></div>
    <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="isCertified" id="isCertified" value="true" th:checked="${skill.isCertified}" onchange="toggleCertFields(this.checked)"><label class="form-check-label fw-bold" for="isCertified">Có chứng chỉ</label></div></div>
    <div id="certFields" th:style="${skill.isCertified ? '' : 'display:none'}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Tên chứng chỉ</label><input type="text" name="certificateName" class="form-control" th:value="${skill.certificateName}" placeholder="VD: AWS Certified..."></div><div class="col-md-6"><label class="form-label">URL chứng chỉ</label><input type="url" name="certificateUrl" class="form-control" th:value="${skill.certificateUrl}" placeholder="https://..."></div><div class="col-md-6"><label class="form-label">Ngày cấp</label><input type="date" name="issuedDate" class="form-control" th:value="${skill.issuedDate}"></div><div class="col-md-6"><label class="form-label">Ngày hết hạn</label><input type="date" name="expiryDate" class="form-control" th:value="${skill.expiryDate}"></div></div></div>
    <div class="col-12"><label class="form-label">Ghi chú</label><textarea name="notes" class="form-control" rows="3" th:text="${skill.notes}" placeholder="Ghi chú thêm..."></textarea></div><div class="col-12 d-flex gap-2 mt-2"><button type="submit" class="btn-save btn"><i class="bi bi-check-lg me-2"></i>Lưu kỹ năng</button><a th:href="@{/admin/skills}" class="btn btn-outline-secondary px-4">Hủy</a></div></div></form></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script>function toggleCertFields(show){document.getElementById('certFields').style.display=show?'':'none';}</script><script th:src="@{/js/hrms-ui.js}"></script>
</body></html>
